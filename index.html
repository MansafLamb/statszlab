<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Z-Lab</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#0f766e">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Source+Sans+3:wght@400;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: slim sticky bar (brand, Practice/Study, menu) + scrolling topic chips; one topic at a time in 4 steps. Phone-first. */
:root{--bg:#f2f5f7;--card:#ffffff;--fg:#13212c;--mute:#5a6b79;--line:#d5dee5;--accent:#0f766e;--accent-fg:#ffffff;--soft:#e3f1ee;--shade:#e8590c;--you:#2563eb;--good:#15803d;--bad:#c0262d;--warn:#fff3e2;--paper:#fffdf7;--ink:#18222d;--rule:#e2e7ec;--shadow:0 1px 2px rgba(19,33,44,.06),0 4px 14px rgba(19,33,44,.05);
--display:'Bricolage Grotesque',system-ui,sans-serif;--body:'Source Sans 3',system-ui,-apple-system,'Segoe UI',sans-serif;--mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1218;--card:#131e27;--fg:#e5edf2;--mute:#95a7b5;--line:#253541;--accent:#2dd4bf;--accent-fg:#04221e;--soft:#0f2d29;--shade:#fb923c;--you:#60a5fa;--good:#4ade80;--bad:#f87171;--warn:#2a2013;--paper:#f6f3ea;--ink:#18222d;--rule:#e2ddd0;--shadow:0 1px 2px rgba(0,0,0,.35);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b1218;--card:#131e27;--fg:#e5edf2;--mute:#95a7b5;--line:#253541;--accent:#2dd4bf;--accent-fg:#04221e;--soft:#0f2d29;--shade:#fb923c;--you:#60a5fa;--good:#4ade80;--bad:#f87171;--warn:#2a2013;--paper:#f6f3ea;--ink:#18222d;--rule:#e2ddd0;--shadow:0 1px 2px rgba(0,0,0,.35);color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{background:var(--bg);color:var(--fg);font:17px/1.55 var(--body);-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--card)}
button,input,textarea{font-family:inherit}button{touch-action:manipulation}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:8;background:var(--card);border-bottom:1px solid var(--line)}
.topin,.navwrap,.page,footer{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.topin{display:flex;align-items:center;gap:10px;padding-block:8px;position:relative}
.brandbox{display:flex;flex-direction:column;line-height:1.05}
.brand{font:800 1.4rem var(--display);letter-spacing:-.01em}.brand span{color:var(--accent)}
.by{font-size:.74rem;color:var(--mute)}.by b{color:var(--fg)}
.mode{margin-left:auto}
.iconbtn{width:42px;height:42px;display:grid;place-items:center;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:10px;cursor:pointer}
.iconbtn svg{width:20px;height:20px}
.tools{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
#menubtn{display:none}
@media (max-width:900px){
 #menubtn{display:grid}
 .tools{display:none;position:absolute;top:calc(100% + 6px);right:max(16px,env(safe-area-inset-right,0px));flex-direction:column;align-items:stretch;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;box-shadow:0 10px 30px rgba(0,0,0,.18);width:min(260px,calc(100vw - 32px));z-index:9}
 .top.open .tools{display:flex}
 .tools .ghost{text-align:left}
 .tools .theme{justify-content:space-between}.tools .theme button{flex:1}
}
.navwrap{padding-block:10px 0}
#nav{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:6px;align-items:center;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
#nav::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:999px;padding:8px 13px;font:600 .9rem var(--body);cursor:pointer;display:flex;gap:6px;align-items:center;min-height:40px}
.chip.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.navunit{flex:none;font:700 .68rem var(--body);text-transform:uppercase;letter-spacing:.09em;color:var(--mute);padding:0 2px 0 8px}
.cnt{font:500 .72rem var(--mono);opacity:.75}
.page{padding-block:14px 40px}
#main,#sect{display:flex;flex-direction:column;gap:16px;min-width:0}
h1,h2,h3{font-family:var(--display);line-height:1.15;text-wrap:balance;margin:0}h2{font-size:1.7rem}#main h3{font-size:1.3rem}
p{margin:0}.mute{color:var(--mute)}.small{font-size:.85rem}
.eyebrow{font:700 .74rem var(--body);letter-spacing:.09em;text-transform:uppercase;color:var(--accent)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:10px;min-width:0;box-shadow:var(--shadow);scroll-margin-top:72px}
.card.warn{background:var(--warn)}
.sheet{content-visibility:auto;contain-intrinsic-size:auto 1200px}
.hero h2{font-size:1.5rem}
.prose{display:flex;flex-direction:column;gap:8px;min-width:0}.prose ul,.card ul,.prose ol{margin:0;padding-left:1.25rem;display:flex;flex-direction:column;gap:4px}
.big{font:500 1rem/1.6 var(--mono);background:var(--soft);padding:10px 14px;border-radius:8px;overflow-x:auto}
.meter{height:8px;background:var(--line);border-radius:4px;overflow:hidden}.meter span{display:block;height:100%;background:var(--accent)}.meter.sm{height:5px;width:100%}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.gridunit{grid-column:1/-1;margin-top:6px}
.tcard{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;cursor:pointer;color:var(--fg);font:inherit;box-shadow:var(--shadow)}
.tcard:hover{border-color:var(--accent)}.tnum{grid-row:span 3;font:800 1.6rem var(--display);color:var(--accent)}.tname{font-weight:700}
.thead{display:flex;flex-direction:column;gap:4px}
.steps{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);scrollbar-width:none}.steps::-webkit-scrollbar{display:none}
.steps button{flex:none;background:none;border:0;border-bottom:3px solid transparent;color:var(--mute);font:700 .95rem var(--body);padding:10px 10px;cursor:pointer}
.steps button[aria-selected=true]{color:var(--fg);border-bottom-color:var(--accent)}
.gbox{overflow-x:auto;min-width:0}.gbox svg{width:100%;height:auto;display:block}
.qtext{font-size:1.08rem}
ol.sol{margin:0;padding-left:1.4rem;display:flex;flex-direction:column;gap:6px}.big-ol{font-size:1.05rem}
.ans{font-size:1.05rem;padding:10px 12px;border-left:3px solid var(--accent);background:var(--soft);border-radius:0 8px 8px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row.end{justify-content:flex-end}.row.between{justify-content:space-between}
button.pri,button.sec,button.ghost{font:700 .95rem var(--body);padding:10px 16px;border-radius:10px;cursor:pointer;border:1px solid var(--accent);min-height:44px}
button.pri{background:var(--accent);color:var(--accent-fg)}button.sec{background:transparent;color:var(--accent)}
button.ghost{background:transparent;color:var(--fg);border-color:var(--line);font-weight:600}
button:disabled{opacity:.55;cursor:default}
:focus-visible{outline:2px solid var(--you);outline-offset:2px}
.seg{display:flex;gap:3px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{border:0;background:transparent;color:var(--fg);border-radius:7px;padding:7px 12px;font:600 .9rem var(--body);cursor:pointer;min-height:36px}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--accent-fg)}
.dots{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:6px;max-width:460px}
.qd{aspect-ratio:1;width:100%;max-width:42px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--fg);font:600 .85rem var(--mono);cursor:pointer;padding:0}
.qd.first{background:var(--good);color:var(--card);border-color:var(--good)}.qd.solved{border:2px solid var(--good);color:var(--good)}.qd.shown{border:2px solid var(--shade);color:var(--shade)}
.qd.cur{outline:2px solid var(--fg);outline-offset:2px}
.lives{display:flex;gap:5px}.lives .dot{width:12px;height:12px;border-radius:50%;background:var(--bad)}.lives .dot.off{background:var(--line)}
.choices{display:flex;flex-direction:column;gap:8px}
.choice{text-align:left;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:10px;padding:12px 14px;font:inherit;cursor:pointer;min-height:48px}
.choice:hover:not(:disabled){border-color:var(--accent)}.choice.right{border:2px solid var(--good);background:var(--soft)}.choice.wrong{border-color:var(--bad);color:var(--bad);text-decoration:line-through}
.fields{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.field{display:flex;flex-direction:column;gap:3px;flex:1 1 150px;min-width:0;font-size:.85rem;color:var(--mute)}.field.wide{flex-basis:100%}
.inwrap{display:flex;gap:4px;min-width:0}
.field input[type=text],textarea{font:500 16px var(--mono);padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg);width:100%;min-width:0;min-height:46px}
textarea{resize:vertical;line-height:1.5}
.pm{flex:none;width:46px;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:10px;font:700 1.1rem var(--mono);cursor:pointer}
input[type=range]{width:100%;accent-color:var(--accent);height:32px}
input.bad{border-color:var(--bad)!important}input.good{border-color:var(--good)!important}
.fb{padding:12px 14px;border-radius:10px;border:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.fb.ok{border-color:var(--good)}.fb.ok>b{color:var(--good)}.fb.no{border-color:var(--bad)}.fb.no>b{color:var(--bad)}.fb.rev{border-color:var(--shade);background:var(--soft)}
.anskey{font:500 1rem var(--mono);overflow-wrap:anywhere}.hint{color:var(--mute);font-size:.92rem}.badtxt{color:var(--bad)}
.padtools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.paper{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--paper);background-image:repeating-linear-gradient(to bottom,transparent 0 31px,var(--rule) 31px 32px)}
.paper canvas{display:block;width:100%;touch-action:none;cursor:crosshair}
.tbl{border-collapse:collapse;font:500 .82rem var(--mono);font-variant-numeric:tabular-nums}.tbl th,.tbl td{border:1px solid var(--line);padding:4px 6px;text-align:right}.tbl th{background:var(--soft)}
.prose .tbl,.tblwrap{display:block;overflow-x:auto;max-width:100%}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--fg);padding:0;width:min(760px,calc(100vw - 24px));max-height:86vh}
dialog::backdrop{background:rgba(0,0,0,.5)}
.dlghead{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--card)}
.dlgbody{padding:12px 14px;overflow:auto;max-height:calc(86vh - 66px);display:flex;flex-direction:column;gap:8px;-webkit-overflow-scrolling:touch}
footer{padding-block:6px 30px;color:var(--mute);font-size:.88rem;text-align:center}footer b{color:var(--fg)}
.toc{display:flex;flex-wrap:wrap;gap:6px}.toc a{font-size:.85rem;color:var(--accent);border:1px solid var(--line);border-radius:999px;padding:5px 11px;text-decoration:none;background:var(--card)}
.stps{display:flex;flex-direction:column;gap:14px}.stp{display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px}
.snum{width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--accent-fg);font:700 .85rem var(--mono);display:grid;place-items:center}
.sbody{display:flex;flex-direction:column;gap:6px;min-width:0}.sbody h4{margin:0;font:700 1.02rem var(--body)}.why{color:var(--mute)}
.work{font:500 .95rem/1.7 var(--mono);background:var(--paper);color:var(--ink);border:1px solid var(--line);border-left:3px solid var(--shade);border-radius:8px;padding:8px 12px;overflow-wrap:anywhere;position:relative}
.hid{cursor:pointer;color:transparent!important;background:repeating-linear-gradient(135deg,var(--soft) 0 10px,var(--card) 10px 20px)!important;user-select:none;min-height:44px}
.hid *{visibility:hidden}.hid::after{content:"Tap to reveal";position:absolute;inset:0;display:grid;place-items:center;color:var(--accent);font:700 .9rem var(--body)}
.ans.hid{position:relative}
.tog{display:flex;gap:8px;align-items:center;font-weight:600;cursor:pointer;min-height:44px}.tog input{width:20px;height:20px;accent-color:var(--accent)}
.cases{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}.cases>div{border:1px solid var(--line);border-radius:10px;padding:8px;font-size:.9rem}.cases svg{width:100%;height:auto}.cases .tk{display:none}
.fs td:nth-child(2){white-space:nowrap}.fs td,.fs th{text-align:left}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:20;max-width:90vw}#toast.show{opacity:1;transform:translateX(-50%)}
/* graph */
.ax{stroke:var(--mute);stroke-width:1}.cv{fill:none;stroke:var(--fg);stroke-width:2.4}.gh{fill:none;stroke:var(--mute);stroke-width:1.6;stroke-dasharray:4 4}
.sh{fill:var(--shade);fill-opacity:.42}.mk{stroke:var(--fg);stroke-width:2;stroke-dasharray:5 3}.mk.you{stroke:var(--you);stroke-width:2.8}
.mkt{fill:var(--fg);font:600 13px var(--mono)}.mkt.you{fill:var(--you)}.tk{fill:var(--mute);font:12px var(--mono)}.zt{opacity:.7}.lb{fill:var(--fg);font:600 14px var(--body)}
.bar{fill:var(--line)}.baron{fill:var(--accent);fill-opacity:.55}.cil{stroke:var(--you);stroke-width:4;stroke-linecap:round}.cid{fill:var(--you)}
@media (max-width:600px){
 body{font-size:16.5px}h2{font-size:1.4rem}.hero h2{font-size:1.3rem}.card{padding:14px;border-radius:12px}
 .brand{font-size:1.25rem}.seg button{padding:7px 10px}
 .tk{font-size:23px}.zt{font-size:18px}.mkt{font-size:21px}.lb{font-size:21px}.cv{stroke-width:3}
 .fields .pri{flex:1 1 100%}
 .grid{grid-template-columns:1fr 1fr}.tcard{grid-template-columns:1fr;padding:12px}.tnum{grid-row:auto;font-size:1.3rem}
 .stp{grid-template-columns:24px minmax(0,1fr);gap:8px}.snum{width:24px;height:24px;font-size:.75rem}
}
@media (max-width:360px){.by{display:none}.grid{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<header class="top" id="top"><div class="topin">
 <div class="brandbox"><div class="brand">Z<span>-</span>Lab</div><div class="by">Made by <b>Christian</b></div></div>
 <div class="seg mode" id="mode" role="group" aria-label="Mode"><button data-mode="practice">Practice</button><button data-mode="study">Study</button></div>
 <button class="iconbtn" id="menubtn" aria-expanded="false" aria-controls="tools" aria-label="Menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
 <div class="tools" id="tools">
  <div class="seg theme" id="theme" role="group" aria-label="Theme"><button data-th="auto">Auto</button><button data-th="light">Light</button><button data-th="dark">Dark</button></div>
  <button class="ghost" id="btnz">Z-table</button><button class="ghost" id="btnt">t-table</button>
  <button class="ghost" id="btnsave">Save progress</button><button class="ghost" id="btnload">Load progress</button>
  <input type="file" id="loadfile" accept=".json,application/json" hidden>
 </div></div></header>
<div class="navwrap"><nav id="nav" aria-label="Topics"></nav></div>
<div class="page"><main id="main"></main></div>
<footer>Z-Lab · ECON3169 Statistics finals reviewer · Made by <b>Christian Luther S. Acob</b></footer>
<dialog id="tbl"><div class="dlghead"><b id="tbltitle">Table</b><button class="ghost" id="tblclose">Close</button></div><div class="dlgbody" id="tblbody"></div></dialog>
<script>
// ===== Z-Lab core: math, tables, random numbers, graph, solution helpers =====
function erf(x){const s=x<0?-1:1;x=Math.abs(x);const t=1/(1+.3275911*x);const y=1-(((((1.061405429*t-1.453152027)*t)+1.421413741)*t-.284496736)*t+.254829592)*t*Math.exp(-x*x);return s*y}
const Phi=z=>.5*(1+erf(z/Math.SQRT2));
const r2=v=>Math.round(v*100)/100;
const r4=v=>Math.round(v*10000)/10000;
// z-table value: area from 0 to |z| (z rounded to 2 decimals, like the printed table)
const A=z=>r4(Phi(Math.abs(r2(z)))-.5);
// reverse lookup: closest z (2 decimals) whose table area matches
function invA(area){let best=0,bd=9;for(let i=0;i<=349;i++){const z=i/100,d=Math.abs(A(z)-area);if(d<bd-1e-9){bd=d;best=z}}return best}
const ZC={90:1.645,95:1.96,99:2.576};
const TT={1:[6.314,12.706,63.657],2:[2.920,4.303,9.925],3:[2.353,3.182,5.841],4:[2.132,2.776,4.604],5:[2.015,2.571,4.032],6:[1.943,2.447,3.707],7:[1.895,2.365,3.499],8:[1.860,2.306,3.355],9:[1.833,2.262,3.250],10:[1.812,2.228,3.169],11:[1.796,2.201,3.106],12:[1.782,2.179,3.055],13:[1.771,2.160,3.012],14:[1.761,2.145,2.977],15:[1.753,2.131,2.947],16:[1.746,2.120,2.921],17:[1.740,2.110,2.898],18:[1.734,2.101,2.878],19:[1.729,2.093,2.861],20:[1.725,2.086,2.845],21:[1.721,2.080,2.831],22:[1.717,2.074,2.819],23:[1.714,2.069,2.807],24:[1.711,2.064,2.797],25:[1.708,2.060,2.787],26:[1.706,2.056,2.779],27:[1.703,2.052,2.771],28:[1.701,2.048,2.763],29:[1.699,2.045,2.756]};
const tval=(df,cl)=>TT[df][cl===90?0:cl===95?1:2];

// formatting
const f4=v=>r4(v).toFixed(4);
const f2=v=>r2(v).toFixed(2);
const nf=(v,d=3)=>{const p=10**d;return (Math.round(v*p)/p).toLocaleString('en-US',{maximumFractionDigits:d})};
const pc=v=>(v*100).toFixed(2)+'%';

// seeded random numbers so every set is repeatable
function RNG(seed){let a=seed>>>0;const n=()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
  const r={n,int:(lo,hi)=>lo+Math.floor(n()*(hi-lo+1)),pick:arr=>arr[Math.floor(n()*arr.length)],step:(lo,hi,s)=>r2(lo+Math.floor(n()*((hi-lo)/s+1))*s),
    sign:()=>n()<.5?-1:1,shuffle:arr=>{arr=arr.slice();for(let i=arr.length-1;i>0;i--){const j=Math.floor(n()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}return arr}};return r}
function hash(s){let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}

// ===== graph =====
// opts: mu, sd, regions:[[a,b]] (null = open end), markers:[{x,label,kind}], bars:{lo,hi,on:[a,b]}, note, showZ, ci:[lo,hi]
function graph(o){
  const mu=o.mu??0,sd=o.sd??1,W=640,H=250,L=30,R=610,B=192,Hh=150,tsd=o.ghost?o.ghost.sd:sd,lo=o.ghost?mu-3.8*tsd:mu-3.8*sd,hi=o.ghost?mu+3.8*tsd:mu+3.8*sd;
  const px=x=>L+(x-lo)/(hi-lo)*(R-L),py=z=>B-Hh*Math.exp(-z*z/2),cl=x=>Math.min(hi,Math.max(lo,x));
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Bell curve">`;
  if(o.bars){const b=o.bars,step=1;const w=(R-L)/(hi-lo)*step;
    for(let k=Math.ceil(lo);k<=Math.floor(hi);k++){const on=b.on&&k>=b.on[0]&&k<=b.on[1];const h=Hh*Math.exp(-(((k-mu)/sd)**2)/2);
      s+=`<rect x="${px(k-.5)}" y="${B-h}" width="${Math.max(.5,w-.6)}" height="${h}" class="${on?'baron':'bar'}"/>`}}

// ===== probability solver (the class routine) =====
// region: [a,b] with null for open end; or {tails:[a,b]} = left of a plus right of b
function solveProb(mu,se,region,opt={}){
  const st=[],sym=opt.sym||'x';
  const zOf=v=>(v-mu)/se, zs=v=>`z = (${nf(v)} − ${nf(mu)}) / ${nf(se,4)} = <b>${f2(zOf(v))}</b>`;
  if(region.tails){const [a,b]=region.tails,za=r2(zOf(a)),zb=r2(zOf(b));
    if(mu!==0||se!==1)st.push(`Convert both edges: ${zs(a)} and ${zs(b)}.`);
    const t1=r4(.5-A(za)),t2=r4(.5-A(zb));
    st.push(`Left tail: 0.5 − A(${f2(Math.abs(za))}) = 0.5 − ${f4(A(za))} = ${f4(t1)}.`);
    st.push(`Right tail: 0.5 − A(${f2(Math.abs(zb))}) = 0.5 − ${f4(A(zb))} = ${f4(t2)}.`);
    const ans=r4(t1+t2);st.push(`Two separate tails, so add them: ${f4(t1)} + ${f4(t2)} = <b>${f4(ans)}</b> (${pc(ans)}).`);return{ans,steps:st}}
  const [a,b]=region;const za=a==null?null:r2(zOf(a)),zb=b==null?null:r2(zOf(b));
  const cv=[];if(a!=null)cv.push(zs(a));if(b!=null)cv.push(zs(b));
  if(mu!==0||se!==1)st.push(`Convert to z: ${cv.join(' and ')}.`);
  let ans;
  if(a==null){const Ab=A(zb);if(zb>=0){ans=.5+Ab;st.push(`You want everything to the left of a positive z. That is the whole left half plus the table area: 0.5 + A(${f2(zb)}) = 0.5 + ${f4(Ab)}.`)}
    else{ans=.5-Ab;st.push(`Left of a negative z is the small left tail: 0.5 − A(${f2(-zb)}) = 0.5 − ${f4(Ab)}.`)}}
  else if(b==null){const Aa=A(za);if(za>=0){ans=.5-Aa;st.push(`Right of a positive z is the small right tail: 0.5 − A(${f2(za)}) = 0.5 − ${f4(Aa)}.`)}
    else{ans=.5+Aa;st.push(`Right of a negative z is the big side: A(${f2(-za)}) + 0.5 = ${f4(Aa)} + 0.5.`)}}
  else{const Aa=A(za),Ab=A(zb);
    if(za===0||zb===0){ans=za===0?Ab:Aa;st.push(`One edge is the mean (z = 0), so the table area is the answer: A(${f2(Math.abs(za===0?zb:za))}) = ${f4(ans)}.`)}
    else if(za*zb>0){ans=Math.abs(Ab-Aa);st.push(`Both z are on the same side of the middle, so subtract: A(${f2(Math.abs(zb))}) = ${f4(Ab)}, A(${f2(Math.abs(za))}) = ${f4(Aa)}, difference = ${f4(Math.abs(Ab-Aa))}.`)}
    else{ans=Aa+Ab;st.push(`The z values are on opposite sides of the middle, so add: A(${f2(-za)}) + A(${f2(zb)}) = ${f4(Aa)} + ${f4(Ab)}.`)}}
  ans=r4(ans);st.push(`Answer: <b>${f4(ans)}</b>, or ${pc(ans)}.`);return{ans,steps:st}}

// z-table html (area from 0 to z)
function zTableHTML(){let h='<table class="tbl"><thead><tr><th>z</th>';for(let c=0;c<10;c++)h+=`<th>.0${c}</th>`;h+='</tr></thead><tbody>';
  for(let r=0;r<35;r++){h+=`<tr><th>${(r/10).toFixed(1)}</th>`;for(let c=0;c<10;c++)h+=`<td data-z="${(r/10+c/100).toFixed(2)}">${A(r/10+c/100).toFixed(4).slice(1)}</td>`;h+='</tr>'}return h+'</tbody></table>'}

   r=>{const c=r.pick(CTX_APP),z=r.step(-2.8,2.8,.01)||.84,x=r2(c.mu+z*c.sd);return{text:`The ${c.n} has mean ${nf(c.mu)} and sd ${nf(c.sd)}. A value has z = ${f2(z)}. What is the value?`,fields:[{label:'X',ans:x,tol:c.sd*.006+.006}],
     steps:['X = μ + zσ.',`X = ${nf(c.mu)} + (${f2(z)})(${nf(c.sd)}) = ${nf(c.mu)} + ${nf(z*c.sd)}.`,`X = <b>${nf(x)}</b>.`],graph:{mu:c.mu,sd:c.sd},live:v=>({mu:c.mu,sd:c.sd,markers:[{x:v[0],label:'your X',kind:'you'}]}),hint:'X = mean + z × sd.'}},
   r=>{const m1=r.int(60,80),s1=r.int(5,12),m2=r.int(40,60),s2=r.int(4,10),x1=m1+r.int(1,2)*s1-r.int(0,4),x2=m2+r.int(1,2)*s2-r.int(0,4);const z1=(x1-m1)/s1,z2=(x2-m2)/s2;
    if(Math.abs(z1-z2)<.05)return UNIT_A[1].gen.medium[0](r);const ch=['Economics','Statistics','They are equal'];const c=z1>z2?0:1;
    return MC(`You scored ${x1} in Economics (mean ${m1}, sd ${s1}) and ${x2} in Statistics (mean ${m2}, sd ${s2}). In which subject did you do relatively better?`,ch,c,[`Economics: z = (${x1} − ${m1}) / ${s1} = ${f2(z1)}.`,`Statistics: z = (${x2} − ${m2}) / ${s2} = ${f2(z2)}.`,`The higher z is relatively better: <b>${ch[c]}</b>.`])},
   r=>{const mu=r.int(20,100)*1000,sd=r.int(3,15)*1000,x=mu+r.int(-25,25)*100;const z=(x-mu)/sd;return{text:`Monthly salaries of fresh graduates average ₱${nf(mu)} with sd ₱${nf(sd)}. What is the z-score of ₱${nf(x)}?`,fields:[{label:'z',ans:r2(z),tol:.011}],steps:[`z = (${nf(x)} − ${nf(mu)}) / ${nf(sd)} = ${nf(x-mu)} / ${nf(sd)} = <b>${f2(z)}</b>.`],graph:{mu,sd,markers:[{x,label:nf(x)}]},live:v=>({mu,sd,markers:[{x,label:nf(x)},{x:mu+v[0]*sd,label:'your z',kind:'you'}]}),hint:'Subtract first, then divide.'}}],
  hard:[
   r=>{const mu=r.int(50,90),sd=r.int(4,15),z=r.pick([-2,-1.5,-1.25,-.5,.5,1.25,1.5,2,2.5]),x=r2(mu+z*sd);return{text:`A value of ${nf(x)} has a z-score of ${z} in a distribution with mean ${mu}. What is the standard deviation?`,fields:[{label:'σ',ans:sd,tol:.02}],steps:['Start from z = (X − μ)/σ and solve for σ: σ = (X − μ)/z.',`σ = (${nf(x)} − ${mu}) / ${z} = ${nf(x-mu)} / ${z} = <b>${sd}</b>.`],hint:'Rearrange: σ = (X − μ) / z.'}},
   r=>{const sd=r.int(3,20),mu=r.int(30,120),z=r.pick([-2.2,-1.6,-.8,.6,1.4,2.4]),x=r2(mu+z*sd);return{text:`A distribution has sd ${sd}. A value of ${nf(x)} sits at z = ${z}. What is the mean?`,fields:[{label:'μ',ans:mu,tol:.02}],steps:['From X = μ + zσ, solve for μ: μ = X − zσ.',`μ = ${nf(x)} − (${z})(${sd}) = ${nf(x)} − (${nf(z*sd)}) = <b>${mu}</b>.`],graph:{mu,sd},hint:'μ = X − zσ.'}},
   r=>{const mu=r.int(-40,40)*1000,sd=r.int(5,30)*1000,z=r.step(-3,3,.01),x=r2(mu+z*sd);return{text:`A company's monthly profit (₱, can be negative) averages ${nf(mu)} with sd ${nf(sd)}. Find X when z = ${f2(z)}.`,fields:[{label:'X',ans:x,tol:sd*.006}],steps:[`X = μ + zσ = ${nf(mu)} + (${f2(z)})(${nf(sd)}) = <b>${nf(x)}</b>.`],graph:{mu,sd},live:v=>({mu,sd,markers:[{x:v[0],label:'your X',kind:'you'}]}),hint:'Careful with the signs.'}}]}},

{id:'area',name:'Areas with the z-table',unit:'Normal Distribution',
 learn:[
  ['Area = probability','Shaded area under the curve = the probability of landing there. The whole curve is 1. Each half is 0.5.'],
  ['What the table gives you','Your z-table (Table A) gives the area <b>from 0 to z</b>. Find the row (first decimal, like 1.8) and the column (second decimal, like .05). Row 1.8 + column .05 = 0.4678. For a negative z, use the same number; the curve is symmetric.'],
  ['The 5 rules','<ul><li><b>0 to z</b>: just the table, A</li><li><b>Tail</b> (beyond z, away from the middle): 0.5 − A</li><li><b>Big side</b> (past the middle): 0.5 + A</li><li><b>Between two z, same side</b>: subtract the two A\'s</li><li><b>Between two z, opposite sides</b>: add the two A\'s</li><li><b>Two separate tails</b>: find each tail, then add</li></ul>'],
  ['Going backwards','If you are given an area and asked for z, look for the area <b>inside</b> the table, then read off its row and column. If the area includes a half (like 0.85 to the left), take away 0.5 first.']],
 play:'area',
 examples:[
  {title:'Between z = 0 and z = 1.85 (PPT)',text:'Find the area between z = 0 and z = 1.85.',graph:{regions:[[0,1.85]],markers:[{x:1.85,label:'1.85'}]},steps:['Row 1.8, column .05.','A(1.85) = <b>0.4678</b> or 46.78%.'],answer:'0.4678'},
  {title:'Right of z = 1.15 (PPT)',text:'Find the area to the right of z = 1.15.',graph:{regions:[[1.15,null]],markers:[{x:1.15,label:'1.15'}]},steps:['A(1.15) = 0.3749 (area from 0 to 1.15).','You want the tail: 0.5000 − 0.3749 = <b>0.1251</b> or 12.51%.'],answer:'0.1251'},
  {title:'Between z = −1.85 and z = 1.15 (PPT)',text:'Find the area between z = −1.85 and z = 1.15.',graph:{regions:[[-1.85,1.15]]},steps:['Opposite sides of the middle, so add.','A(1.85) = 0.4678 and A(1.15) = 0.3749.','0.4678 + 0.3749 = <b>0.8427</b> or 84.27%.'],answer:'0.8427'},
  {title:'Right of 1.15 and left of −1.85 (PPT)',text:'Find the area to the right of z = 1.15 and to the left of z = −1.85.',graph:{regions:[[null,-1.85],[1.15,null]]},steps:['Left tail: 0.5 − 0.4678 = 0.0322.','Right tail: 0.5 − 0.3749 = 0.1251.','Add the tails: 0.0322 + 0.1251 = <b>0.1573</b>.'],answer:'0.1573'},
  {title:'Backwards: area 0.3962 (PPT)',text:'The area between 0 and z is 0.3962. Find z.',graph:{regions:[[0,1.26]],markers:[{x:1.26,label:'1.26'}]},steps:['Look inside the table for 0.3962.','It sits in row 1.2, column .06.','z = <b>1.26</b>. (The slide writes 1.36, but 1.36 gives 0.4131. 1.26 is right.)'],answer:'z = 1.26'}],
 how:{steps:['Draw a bell curve and mark 0 in the middle.','Mark the z value(s) and shade what the question asks for.','Look up A(z) for each z (use the positive value).','Pick the rule: A, 0.5 − A, 0.5 + A, subtract, add.','Write it as a decimal and a percent.'],mistakes:['Reading the table value as the tail. The table is always 0 to z.','Subtracting when the z values are on opposite sides (you should add).','"Left of 1.15" is the big side: 0.5 + A, not 0.5 − A.'],formula:'tail = 0.5 − A · big side = 0.5 + A'},
 gen:{
  easy:[
   r=>{const z=r.step(.1,3,.01)*r.sign();return QP(`Find the area under the standard normal curve between z = 0 and z = ${f2(z)}.`,0,1,z>0?[0,z]:[z,0],{showZ:false})},
   r=>{const z=r.step(.1,2.9,.01);return QP(`Find the area to the right of z = ${f2(z)}.`,0,1,[z,null],{showZ:false})},
   r=>{const z=-r.step(.1,2.9,.01);return QP(`Find the area to the left of z = ${f2(z)}.`,0,1,[null,z],{showZ:false})}],
  medium:[
   r=>{const z=r.step(.1,2.9,.01);return QP(`Find the area to the left of z = ${f2(z)}.`,0,1,[null,z],{showZ:false})},
   r=>{const z=-r.step(.1,2.9,.01);return QP(`Find the area to the right of z = ${f2(z)}.`,0,1,[z,null],{showZ:false})},
   r=>{const s=r.sign();let a=r.step(.1,1.5,.01),b=r2(a+r.step(.2,1.4,.01));const reg=s>0?[a,b]:[-b,-a];return QP(`Find the area between z = ${f2(reg[0])} and z = ${f2(reg[1])}.`,0,1,reg,{showZ:false})},
   r=>{const a=-r.step(.1,2.5,.01),b=r.step(.1,2.5,.01);return QP(`Find the area between z = ${f2(a)} and z = ${f2(b)}.`,0,1,[a,b],{showZ:false})}],
  hard:[
   r=>{const a=-r.step(.5,2.5,.01),b=r.step(.5,2.5,.01);return QP(`Find the area to the right of z = ${f2(b)} and to the left of z = ${f2(a)}.`,0,1,{tails:[a,b]},{showZ:false})},
   r=>{const z=r.step(.1,2.9,.01),ar=A(z);return{text:`The area between 0 and z is ${f4(ar)}. Find z (z is positive).`,fields:[{label:'z',ans:z,tol:.006}],steps:[`Look inside the table for ${f4(ar)}.`,`It sits in row ${(Math.floor(z*10)/10).toFixed(1)}, column .0${Math.round(z*100)%10}.`,`z = <b>${f2(z)}</b>.`],graph:{regions:[[0,z]],showZ:false},live:v=>({regions:[[0,v[0]]],markers:[{x:v[0],label:'your z',kind:'you'}],note:isFinite(v[0])?'area 0 to your z = '+f4(A(v[0])):''}),hint:'Find the area inside the table, then read its row and column.'}},
   r=>{const z=r2(r.step(.1,2.5,.01)*r.sign()),left=r4(.5+(z>0?A(z):-A(z)));return{text:`The area to the LEFT of z is ${f4(left)}. Find z.`,fields:[{label:'z',ans:z,tol:.006}],
     steps:[left>.5?`The area is more than 0.5, so z is positive. Take away the left half: ${f4(left)} − 0.5 = ${f4(left-.5)}.`:`The area is less than 0.5, so z is negative. The table part is 0.5 − ${f4(left)} = ${f4(.5-left)}.`,`Find ${f4(Math.abs(left-.5))} inside the table: z = ${f2(Math.abs(z))}.`,`So z = <b>${f2(z)}</b>.`],graph:{regions:[[null,z]],showZ:false},
     live:v=>({regions:[[null,v[0]]],markers:[{x:v[0],label:'your z',kind:'you'}],note:isFinite(v[0])?'left of your z = '+f4(.5+(v[0]>0?A(v[0]):-A(v[0]))):''}),hint:'More than 0.5 to the left means z is positive. Subtract 0.5, then look inside the table.'}},
   r=>{const z=r.step(.1,2.5,.01),right=r4(.5-A(z));return{text:`The area to the RIGHT of z is ${f4(right)}. Find z.`,fields:[{label:'z',ans:z,tol:.006}],steps:[`A small right tail means z is positive. Table part = 0.5 − ${f4(right)} = ${f4(.5-right)}.`,`Inside the table, ${f4(.5-right)} gives z = <b>${f2(z)}</b>.`],graph:{regions:[[z,null]],showZ:false},
     live:v=>({regions:[[v[0],null]],markers:[{x:v[0],label:'your z',kind:'you'}],note:isFinite(v[0])?'right of your z = '+f4(.5-(v[0]>0?A(v[0]):-A(v[0]))):''}),hint:'0.5 − tail = table area.'}}]}},

{id:'apply',name:'Real-life problems',unit:'Normal Distribution',
 learn:[
  ['Same tool, real units','Real problems give you a mean, an sd and a value in pesos, years or points. Convert the value to z, then use the area rules.'],
  ['Read the wording','"Less than / below / at most" = left side. "More than / above / at least" = right side. "Between" = two edges. For continuous data, &lt; and ≤ give the same answer.'],
  ['Finding a cutoff (backwards)','"Top 20%" means a right tail of 0.20. The area between the mean and the cutoff is 0.5 − 0.20 = 0.30. Find 0.30 inside the table to get z, then X = μ + zσ. For the "bottom" use a negative z.']],
 examples:[
  {title:'Pag-ibig loan (PPT)',text:'The average Pag-ibig salary loan is 23,000 with sd 2,500. Find the probability that an employee owes less than 18,500.',graph:{mu:23000,sd:2500,regions:[[null,18500]]},steps:solveProb(23000,2500,[null,18500]).steps,answer:'0.0359'},
  {title:'Bank managers (PPT)',text:'The average age of bank managers is 40 with sd 5. Find the probability that a manager is between 35 and 46 years old.',graph:{mu:40,sd:5,regions:[[35,46]]},steps:solveProb(40,5,[35,46]).steps,answer:'0.7262'},
  {title:'UST Master\'s cutoff (PPT)',text:'To qualify, candidates must score in the top 20%. Mean 180, sd 25. Find the lowest possible score to qualify.',graph:{mu:180,sd:25,regions:[[201,null]],markers:[{x:201,label:'201'}]},steps:['Top 20% is a right tail of 0.2000.','Area between the mean and the cutoff: 0.5000 − 0.2000 = 0.3000.','Inside the table, 0.3000 is closest to 0.2995 at z = 0.84.','X = μ + zσ = 180 + 0.84(25) = 180 + 21 = <b>201</b>.'],answer:'201'}],
 how:{steps:['Write μ, σ, and the value(s) X.','Draw the curve with μ in the middle. Shade the region the words describe.','Convert each X to z = (X − μ)/σ, round to 2 decimals.','Look up A(z), apply the area rule.','For cutoffs: tail → 0.5 − tail → find inside the table → z → X = μ + zσ.'],mistakes:['Using the tail (0.20) to search the table. Search 0.5 − 0.20 = 0.30.','Forgetting z is negative for a "bottom" cutoff.','Mixing up "below" and "above".'],formula:'z = (X − μ)/σ · X = μ + zσ'},
 gen:{
  easy:[
   r=>{const c=r.pick(CTX_APP),z=r.step(-2.5,-.2,.01),x=r2(c.mu+z*c.sd);const xv=Math.round(x/c.st)*c.st;return QP(`The ${c.n} is normal with mean ${nf(c.mu)} and sd ${nf(c.sd)}. Find the probability that a value is less than ${nf(xv)}.`,c.mu,c.sd,[null,xv])},
   r=>{const c=r.pick(CTX_APP),z=r.step(.2,2.5,.01),x=Math.round((c.mu+z*c.sd)/c.st)*c.st;return QP(`The ${c.n} has mean ${nf(c.mu)} and sd ${nf(c.sd)}. Find the probability that a value is more than ${nf(r2(x))}.`,c.mu,c.sd,[r2(x),null])}],
  medium:[
   r=>{const c=r.pick(CTX_APP),a=Math.round((c.mu-r.step(.2,2.2,.01)*c.sd)/c.st)*c.st,b=Math.round((c.mu+r.step(.2,2.2,.01)*c.sd)/c.st)*c.st;return QP(`The ${c.n} has mean ${nf(c.mu)} and sd ${nf(c.sd)}. Find the probability that a value is between ${nf(r2(a))} and ${nf(r2(b))}.`,c.mu,c.sd,[r2(a),r2(b)])},
   r=>{const c=r.pick(CTX_APP),s=r.sign(),z1=r.step(.2,1.2,.01),z2=r2(z1+r.step(.3,1.3,.01));let a=Math.round((c.mu+s*z1*c.sd)/c.st)*c.st,b=Math.round((c.mu+s*z2*c.sd)/c.st)*c.st;if(a>b)[a,b]=[b,a];return QP(`The ${c.n} has mean ${nf(c.mu)} and sd ${nf(c.sd)}. Find the probability that a value is between ${nf(r2(a))} and ${nf(r2(b))}.`,c.mu,c.sd,[r2(a),r2(b)])},
   r=>{const c=r.pick(CTX_APP),z=r.step(-2,-.2,.01),x=r2(Math.round((c.mu+z*c.sd)/c.st)*c.st);return QP(`The ${c.n} has mean ${nf(c.mu)} and sd ${nf(c.sd)}. Find the probability that a value is at least ${nf(x)}.`,c.mu,c.sd,[x,null])}],
  hard:[
   r=>{const c=r.pick(CTX_APP),p=r.pick([.05,.1,.15,.2,.25,.3]),top=r.n()<.5,z=invA(.5-p),x=r2(c.mu+(top?z:-z)*c.sd);
    return{text:`The ${c.n} has mean ${nf(c.mu)} and sd ${nf(c.sd)}. Find the cutoff for the ${top?'top':'bottom'} ${p*100}%.`,fields:[{label:'Cutoff X',ans:x,tol:c.sd*.012+.006}],
     steps:[`${top?'Top':'Bottom'} ${p*100}% is a ${top?'right':'left'} tail of ${f4(p)}.`,`Area between the mean and the cutoff: 0.5000 − ${f4(p)} = ${f4(.5-p)}.`,`Inside the table, the closest area is ${f4(A(z))} at z = ${f2(z)}. ${top?'':'It is the bottom, so z = −'+f2(z)+'.'}`,`X = μ + zσ = ${nf(c.mu)} + (${top?'':'−'}${f2(z)})(${nf(c.sd)}) = <b>${nf(x)}</b>.`],
     graph:{mu:c.mu,sd:c.sd},live:v=>({mu:c.mu,sd:c.sd,regions:[top?[v[0],null]:[null,v[0]]],markers:[{x:v[0],label:'your cutoff',kind:'you'}],note:isFinite(v[0])?(top?'area above = ':'area below = ')+f4(top?solveProb(c.mu,c.sd,[v[0],null]).ans:solveProb(c.mu,c.sd,[null,v[0]]).ans):''}),hint:'Search the table for 0.5 − tail, not the tail itself.'}},
   r=>{const c=r.pick(CTX_APP),a=r2(Math.round((c.mu-r.step(.5,2,.01)*c.sd)/c.st)*c.st),b=r2(Math.round((c.mu+r.step(.5,2,.01)*c.sd)/c.st)*c.st);return QP(`The ${c.n} has mean ${nf(c.mu)} and sd ${nf(c.sd)}. Find the probability that a value is below ${nf(a)} or above ${nf(b)}.`,c.mu,c.sd,{tails:[a,b]},{hint:'Two separate tails: find each one (0.5 − A), then add.'})},
   r=>{const c=r.pick(CTX_APP),N=r.pick([200,500,1000,1500]),z=r.step(.3,2,.01),x=r2(Math.round((c.mu+z*c.sd)/c.st)*c.st);const s=solveProb(c.mu,c.sd,[x,null]);const cnt=Math.round(N*s.ans);
    return{text:`The ${c.n} has mean ${nf(c.mu)} and sd ${nf(c.sd)}. Out of ${N} cases, about how many are above ${nf(x)}?`,fields:[{label:'How many',ans:cnt,tol:Math.max(1,N*.003)}],steps:s.steps.slice(0,-1).concat([`Probability = ${f4(s.ans)}.`,`Expected count = ${N} × ${f4(s.ans)} = <b>${cnt}</b>.`]),graph:{mu:c.mu,sd:c.sd,regions:[[x,null]]},hint:'Find the probability first, then multiply by the total.'}}]}},

{id:'clt',name:'Sample means (CLT)',unit:'Normal Distribution',
 learn:[
  ['From one person to a group','So far, X was one person. Now we take a <b>sample</b> of n people and look at their average, x̄. The <b>sampling distribution of the sample mean</b> is the distribution of all possible x̄\'s from samples of size n.'],
  ['Central Limit Theorem','The bigger the sample, the more the sampling distribution of x̄ looks normal. Its center is still μ, but it is <b>narrower</b>: averages bounce around less than single values.'],
  ['The formulas','<div class="big">σx̄ = σ / √n<br>z = (x̄ − μ) / (σ / √n)</div>σx̄ is the <b>standard error</b>. Everything else (table, area rules) stays the same.'],
  ['Sampling error','The difference between a sample statistic and the population parameter. It happens because a sample is never a perfect copy of the population.']],
 play:'clt',
 examples:[
  {title:'New car cost (PPT)',text:'The average cost per household of owning a new car is 5,000, sd 1,230. For a sample of 40 households, find P(x̄ > 5,350).',graph:{mu:5000,sd:1230/Math.sqrt(40),regions:[[5350,null]]},steps:['σx̄ = 1,230 / √40 = 194.48.'].concat(solveProb(5000,1230/Math.sqrt(40),[5350,null]).steps),answer:'0.0359'},
  {title:'LTO car ages (PPT)',text:'Average age of a registered car is 120 months, sd 20. For 35 cars, find P(115 < x̄ < 129).',graph:{mu:120,sd:20/Math.sqrt(35),regions:[[115,129]]},steps:['σx̄ = 20 / √35 = 3.3806.'].concat(solveProb(120,20/Math.sqrt(35),[115,129]).steps),answer:'0.9267'},
  {title:'Fresh milk (PPT)',text:'A person drinks 18 liters a month on average, sd 4.5. (a) P(one person drinks more than 16)? (b) P(mean of 32 people is more than 16)?',graph:{mu:18,sd:4.5/Math.sqrt(32),regions:[[16,null]]},steps:['(a) One person: z = (16 − 18)/4.5 = −0.44. Big side: 0.5 + 0.1700 = <b>0.67</b>.','(b) Sample of 32: σx̄ = 4.5/√32 = 0.7955. z = (16 − 18)/0.7955 = −2.51.','Big side: 0.5 + 0.4940 = <b>0.9940</b>.','The sample answer is closer to 1 because averages stay near 18.'],answer:'(a) 0.67 (b) 0.9940'}],
 how:{steps:['Check the question: is it about ONE value or the MEAN of a sample? Sample means use σ/√n.','Compute the standard error σ/√n.','z = (x̄ − μ) / (σ/√n), round to 2 decimals.','Use the area rules as usual.'],mistakes:['Forgetting to divide by √n.','Dividing by n instead of √n.','Using σ/√n for a question about a single person.'],formula:'σx̄ = σ/√n · z = (x̄ − μ)/(σ/√n)'},
 gen:{
  easy:[
   r=>{const c=r.pick(CTX_CLT),n=r.pick(c.ns),se=c.sd/Math.sqrt(n);return{text:`The ${c.n} has σ = ${nf(c.sd)}. For samples of n = ${n}, what is the standard error of the mean?`,fields:[{label:'σx̄',ans:r4(se),tol:Math.max(.006,se*.003)}],steps:['σx̄ = σ / √n.',`σx̄ = ${nf(c.sd)} / √${n} = ${nf(c.sd)} / ${nf(Math.sqrt(n),4)} = <b>${nf(se,4)}</b>.`],graph:{mu:c.mu,sd:se},hint:'Divide σ by the square root of n.'}},
   r=>{const ch=['Gets smaller','Gets bigger','Stays the same','Becomes zero right away'];return MC(`As the sample size n gets bigger, what happens to the spread (standard error) of the sample mean?`,ch,0,['σx̄ = σ/√n. A bigger n means a bigger √n, so the spread <b>gets smaller</b>.'])},
   r=>{const ch=['μ, the population mean','x̄ of one sample only','The median of the sample','σ/√n'];return MC('The sampling distribution of x̄ is centered at…',ch,0,['The average of all possible sample means equals the population mean, <b>μ</b>.'])}],
  medium:[
   r=>{const c=r.pick(CTX_CLT),n=r.pick(c.ns),se=c.sd/Math.sqrt(n),z=r.step(.3,2.6,.01),x=r2(c.mu+z*se);const xv=c.mu>=100?Math.round(x):x;return QP(`The ${c.n} has μ = ${nf(c.mu)} and σ = ${nf(c.sd)}. A sample of ${n} is taken. Find P(x̄ > ${nf(xv)}).`,c.mu,se,[xv,null],{pre:[`σx̄ = ${nf(c.sd)} / √${n} = ${nf(se,4)}.`],hint:'Use σ/√n in the z formula.'})},

const ciCtx=r=>{const c=r.pick(CTX_CI),p=10**c.d;const mu=Math.round((c.mu[0]+r.n()*(c.mu[1]-c.mu[0]))*p)/p,sd=Math.round((c.sd[0]+r.n()*(c.sd[1]-c.sd[0]))*100)/100;return{...c,mu,sd}};
const ciTol=E=>Math.max(.011,Math.abs(E)*.006);
const ciGraph=(xb,se)=>({mu:xb,sd:se,markers:[{x:xb,label:'x̄ = '+nf(xb)}],showZ:false});
const ciLive=(xb,se)=>v=>({mu:xb,sd:se,regions:[[v[0],v[1]]],ci:[v[0],v[1]],markers:[{x:xb,label:'x̄'}],showZ:false});
function zCI(xb,sd,n,cl,known){const z=ZC[cl],se=sd/Math.sqrt(n),E=z*se;return{z,se,E,lo:xb-E,hi:xb+E,steps:[
 `${known?'σ is known':'n = '+n+' ≥ 30'}, so use z. For ${cl}% confidence, z<sub>α/2</sub> = ${z}.`,
 `Standard error: ${known?'σ':'s'}/√n = ${nf(sd)} / √${n} = ${nf(se,4)}.`,
 `Margin of error: E = ${z} × ${nf(se,4)} = <b>${nf(E,4)}</b>.`,
 `Lower limit = ${nf(xb)} − ${nf(E,4)} = <b>${f2(xb-E)}</b>. Upper limit = ${nf(xb)} + ${nf(E,4)} = <b>${f2(xb+E)}</b>.`,
 `We are ${cl}% confident the true mean is between ${f2(xb-E)} and ${f2(xb+E)}.`]}}
function tCI(xb,s,n,cl){const df=n-1,t=tval(df,cl),se=s/Math.sqrt(n),E=t*se;return{t,df,se,E,lo:xb-E,hi:xb+E,steps:[
 `σ is unknown and n = ${n} < 30, so use t. df = n − 1 = ${df}.`,
 `From the t-table, df ${df} at ${cl}%: t = ${t.toFixed(3)}.`,
 `Standard error: s/√n = ${nf(s,4)} / √${n} = ${nf(se,4)}.`,
 `E = ${t.toFixed(3)} × ${nf(se,4)} = <b>${nf(E,4)}</b>.`,
 `Interval: ${nf(xb,4)} ± ${nf(E,4)} → <b>${f2(xb-E)}</b> to <b>${f2(xb+E)}</b>.`]}}
function pCI(X,n,cl){const p=X/n,q=1-p,z=ZC[cl],se=Math.sqrt(p*q/n),E=z*se;return{p,q,z,se,E,lo:p-E,hi:p+E,steps:[
 `p̂ = X/n = ${X}/${n} = ${nf(p,4)}. q̂ = 1 − p̂ = ${nf(q,4)}.`,
 `z for ${cl}% = ${z}.`,
 `√(p̂q̂/n) = √(${nf(p,4)} × ${nf(q,4)} / ${n}) = ${nf(se,5)}.`,
 `E = ${z} × ${nf(se,5)} = <b>${nf(E,4)}</b>.`,
 `Interval: ${nf(p,4)} ± ${nf(E,4)} → <b>${f4(p-E)}</b> to <b>${f4(p+E)}</b>.`]}}
const mean=a=>a.reduce((s,v)=>s+v,0)/a.length;
const sdev=a=>{const m=mean(a);return Math.sqrt(a.reduce((s,v)=>s+(v-m)**2,0)/(a.length-1))};

{id:'cit',name:'CI with the t-distribution',unit:'Confidence Intervals',

 how:{steps:['Ask: is σ known? Is n ≥ 30? If σ unknown and n &lt; 30 → t.','df = n − 1. Read t from the table at your confidence level.','If you get raw data, compute x̄ and s (sample sd, n − 1) with your calculator.','E = t × s/√n.','x̄ − E &lt; μ &lt; x̄ + E.'],mistakes:['Using df = n instead of n − 1.','Using the z value (1.96) when you should use t.','Using the population sd button (σn) instead of the sample sd (sn−1).'],formula:'x̄ ± t(s/√n), df = n − 1'},

  ['The interval','<div class="big">p̂ − z<sub>α/2</sub>√(p̂q̂/n) &lt; p &lt; p̂ + z<sub>α/2</sub>√(p̂q̂/n)</div>E = z<sub>α/2</sub>√(p̂q̂/n) is the bound on the error of estimate. Same z values: 1.645, 1.960, 2.576.']],

{id:'n',name:'Sample size',unit:'Confidence Intervals',
 learn:[
  ['The question','"How many people do I need to survey so my estimate is within E of the truth, with a certain confidence?"'],
  ['For a mean','<div class="big">n = (z<sub>α/2</sub> × σ / E)²</div>σ = population sd (often from a previous study). E = maximum error of estimate.'],
  ['For a proportion','<div class="big">n = p̂q̂ (z<sub>α/2</sub> / E)²</div>If a previous study gives p, use it (q = 1 − p). If there is no info, use p = 0.5. That gives the largest possible n, so you are safe.'],
  ['Always round UP','17.64 becomes 18, even 600.25 becomes 601. Rounding down would give you a sample that is too small.']],
 examples:[
  {title:'College dean (PPT)',text:'σ = 4.5 hours from a previous study. How large a sample is needed to be 95% confident the estimate is within 2.1 hours of the true mean?',steps:['n = (zσ/E)².','n = (1.96 × 4.5 / 2.1)² = (4.2)² = 17.64.','Round up: <b>n = 18</b>.'],answer:'18'},
  {title:'Professors with laptops (PPT)',text:'99% confidence. A previous study shows 48% own laptops. Accurate within 3%. Find the minimum sample size.',steps:['p̂ = 0.48, q̂ = 0.52, z = 2.576, E = 0.03.','n = 0.48 × 0.52 × (2.576 / 0.03)² = 0.2496 × 7373.08 = 1840.32.','Round up: <b>n = 1,841</b>.'],answer:'1,841'},
  {title:'Students who surf the internet (PPT)',text:'Estimate the proportion who surf the internet daily within 4% with 95% confidence. No previous estimate.',steps:['No info, so p = 0.5, q = 0.5.','n = 0.25 × (1.96 / 0.04)² = 0.25 × 2401 = 600.25.','Round up: <b>n = 601</b>.'],answer:'601'}],
 how:{steps:['Decide: mean (has σ) or proportion (has a percent)?','Get z: 1.645 / 1.960 / 2.576.','Write E as a decimal (3% → 0.03).','Plug into the formula.','Round UP to the next whole number.'],mistakes:['Rounding down.','Using 3 instead of 0.03 for E.','Forgetting to square.'],formula:'n = (zσ/E)² · n = p̂q̂(z/E)²'},

  medium:[
   r=>{const p=r.step(.1,.9,.01),E=r.pick([.02,.03,.04,.05]),cl=r.pick([90,95,99]);const raw=p*(1-p)*(ZC[cl]/E)**2,n=Math.ceil(raw-1e-9);return{text:`A researcher wants to estimate a proportion with ${cl}% confidence, within ${E*100}%. A previous study found ${Math.round(p*100)}%. Find the minimum sample size.`,fields:[{label:'n',ans:n,tol:0,type:'n',raw}],steps:[`p̂ = ${p}, q̂ = ${r2(1-p)}, z = ${ZC[cl]}, E = ${E}.`,`n = ${p} × ${r2(1-p)} × (${ZC[cl]} / ${E})² = ${nf(p*(1-p),4)} × ${nf((ZC[cl]/E)**2,2)} = ${nf(raw,4)}.`,`Round up: <b>n = ${nf(n)}</b>.`],hint:'n = p̂q̂(z/E)². E as a decimal.'}},

const rowcol=z=>{z=Math.abs(r2(z));return `row ${(Math.floor(z*10+1e-9)/10).toFixed(1)}, column .0${Math.round(z*100)%10}`};
const P=s=>`<span class="pv">${s}</span>`;
// --- probability problems (normal, CLT, binomial) ---
function wProb(o){
  const st=[],mu=o.mu,se=o.n?o.sd/Math.sqrt(o.n):o.sd,reg=o.region,unit=o.n?'x̄':'X';
  st.push({t:'Write what you know',why:'Before any formula, pull the numbers out of the word problem and name them. Half of all mistakes come from using the wrong number.',work:o.given.concat([`Find: ${o.find}`])});
  if(o.binom){const b=o.binom,q=r2(1-b.p),np=r2(b.n*b.p),nq=r2(b.n*q);
    st.push({t:'Check if the normal curve is allowed',why:'The normal approximation only works when both np and nq are at least 5. If either is below 5, you cannot use the z-table here.',work:[`np = ${b.n}(${b.p}) = ${np} ≥ 5 ✓`,`nq = ${b.n}(${q}) = ${nq} ≥ 5 ✓`,'∴ the normal approximation can be used']});
    st.push({t:'Get the mean and sd of the count',why:'The normal curve we borrow has the same center and spread as the binomial.',work:[`μ = np = ${np}`,`σ = √(npq) = √(${b.n} × ${b.p} × ${q}) = √${nf(b.n*b.p*q,4)} = ${f2(se)}`]});
    st.push({t:'Apply the continuity correction',why:b.why,work:[b.from+'  →  '+b.to]})}
  if(o.n)st.push({t:'Get the standard error',why:'The question is about the MEAN of a sample, not one value. Sample means spread less, so divide σ by √n.',work:[`σx̄ = σ/√n = ${nf(o.sd)}/√${o.n} = ${nf(se,4)}`]});
  const gr=reg.tails?[[null,reg.tails[0]],[reg.tails[1],null]]:[reg];
  st.push({t:'Draw the curve and shade',why:'Put the mean in the middle, mark your value(s), and shade what the question asks. The picture tells you which rule to use later, so never skip it.',g:{mu,sd:se,regions:gr,showZ:mu===0&&se===1?false:undefined,bars:o.binom&&se<12?{on:o.binom.on}:null}});
  const edges=reg.tails?reg.tails:reg.filter(v=>v!=null),zs=edges.map(v=>r2((v-mu)/se));
  if(!(mu===0&&se===1))st.push({t:'Convert to z',why:`The table only knows the standard curve (mean 0, sd 1). The z formula moves your value onto it. Round z to 2 decimals.`,work:edges.map((v,i)=>`z = (${unit} − μ)/${o.n?'σx̄':'σ'} = (${nf(v)} − ${nf(mu)})/${nf(se,4)} = ${f2(zs[i])}`)});
  st.push({t:'Look up the table',why:'The z-table gives the area from the middle (0) out to z. A negative z uses the same number because the curve is symmetric.',work:zs.map(z=>`z = ${f2(z)}: ${rowcol(z)} → A = ${f4(A(z))}`)});
  // rule
  let why,work,ans;const Az=zs.map(A);
  if(reg.tails){const t1=r4(.5-Az[0]),t2=r4(.5-Az[1]);ans=r4(t1+t2);why='There are two separate tails. Find each tail with 0.5 − A, then add them.';work=[`left tail = 0.5000 − ${f4(Az[0])} = ${f4(t1)}`,`right tail = 0.5000 − ${f4(Az[1])} = ${f4(t2)}`,`total = ${f4(t1)} + ${f4(t2)} = ${f4(ans)}`]}
  else{const [a,b]=reg;
    if(a==null){const z=zs[0];if(z>=0){ans=.5+Az[0];why='The shaded part covers the whole left half (0.5) plus the strip from 0 to z. Big side → add 0.5.';work=[`P = 0.5000 + ${f4(Az[0])} = ${f4(ans)}`]}else{ans=.5-Az[0];why='The shaded part is only the small left tail. Tail → subtract from 0.5.';work=[`P = 0.5000 − ${f4(Az[0])} = ${f4(ans)}`]}}
    else if(b==null){const z=zs[0];if(z>=0){ans=.5-Az[0];why='The shaded part is the small right tail. Tail → 0.5 − A.';work=[`P = 0.5000 − ${f4(Az[0])} = ${f4(ans)}`]}else{ans=.5+Az[0];why='The shaded part crosses the middle and takes the whole right half. Big side → A + 0.5.';work=[`P = ${f4(Az[0])} + 0.5000 = ${f4(ans)}`]}}
    else{const [z1,z2]=zs;if(z1===0||z2===0){ans=z1===0?Az[1]:Az[0];why='One edge is the mean itself, so the table area is already the answer.';work=[`P = ${f4(ans)}`]}
      else if(z1*z2>0){ans=Math.abs(Az[1]-Az[0]);why='Both edges are on the same side of the middle. The bigger strip minus the smaller strip leaves the piece between them.';work=[`P = ${f4(Math.max(...Az))} − ${f4(Math.min(...Az))} = ${f4(ans)}`]}
      else{ans=Az[0]+Az[1];why='The edges are on opposite sides of the middle. The shaded part is two strips joined at 0, so add them.';work=[`P = ${f4(Az[0])} + ${f4(Az[1])} = ${f4(ans)}`]}}}
  ans=r4(ans);st.push({t:'Pick the rule and compute',why,work});
  st.push({t:'Answer in words',why:'Give the decimal and the percent, then say what it means in the story. Profs give points for the sentence.',work:[`P = ${f4(ans)} or ${pc(ans)}`,o.say?o.say.replace('%P',pc(ans)):'']});
  return{title:o.title,text:o.text,steps:st,answer:`${f4(ans)} (${pc(ans)})`,src:o.src}}
// --- confidence intervals ---
function wCI(o){const st=[];st.push({t:'Write what you know',why:'List every number and say what it is. Note whether you were given σ (population) or s (sample).',work:o.given.concat([`Find: ${o.find}`])});
  if(o.pre)o.pre.forEach(p=>st.push(p));
  let crit,se,E,lo,hi,mid=o.xb;
  if(o.kind==='p'){const p=o.X/o.n,q=1-p;mid=p;crit=ZC[o.cl];se=Math.sqrt(p*q/o.n);
    st.push({t:'Compute p̂ and q̂',why:'p̂ is the share in your sample. It is the best point estimate of the true proportion p.',work:[`p̂ = X/n = ${o.X}/${o.n} = ${nf(p,4)}`,`q̂ = 1 − p̂ = ${nf(q,4)}`]});
    st.push({t:'Get z for the confidence level',why:`Proportions always use z. Split the confidence in half: ${o.cl/100}/2 = ${o.cl/200}. Find that area inside the z-table.`,work:[`z(α/2) = ${crit}`]});
    st.push({t:'Standard error',why:'This measures how much p̂ would bounce around from sample to sample.',work:[`√(p̂q̂/n) = √(${nf(p,4)} × ${nf(q,4)} / ${o.n}) = ${nf(se,5)}`]})}
  else{const useT=o.kind==='t';se=o.sd/Math.sqrt(o.n);
    st.push({t:'Choose z or t',why:useT?'σ is unknown and n is less than 30. A small sample with an estimated sd needs the wider t-distribution.':o.known?'σ (the population sd) is given, so z is used.':'σ is unknown, but n ≥ 30, so the PPT rule says use z with s in place of σ.',work:[useT?`σ unknown, n = ${o.n} < 30 → t, df = n − 1 = ${o.n-1}`:`${o.known?'σ known':'n = '+o.n+' ≥ 30'} → z`]});
    crit=useT?tval(o.n-1,o.cl):ZC[o.cl];
    st.push({t:useT?'Read t from the t-table':'Get z for the confidence level',why:useT?`Go to row df = ${o.n-1} and the ${o.cl}% column.`:`Half of ${o.cl}% is ${o.cl/200}. The z whose table area is ${o.cl/200} is ${crit}. (90% → 1.645, 95% → 1.960, 99% → 2.576.)`,work:[useT?`t(α/2) = ${crit.toFixed(3)}`:`z(α/2) = ${crit}`]});
    st.push({t:'Standard error',why:'How much the sample mean typically misses μ by.',work:[`${o.known?'σ':'s'}/√n = ${nf(o.sd,4)}/√${o.n} = ${nf(se,4)}`]})}
  E=crit*se;lo=mid-E;hi=mid+E;const d=o.kind==='p'?4:2,fm=v=>v.toFixed(d);
  st.push({t:'Margin of error E',why:'E is the "plus or minus" part. It is the maximum error of estimate at this confidence level.',work:[`E = ${o.kind==='t'?crit.toFixed(3):crit} × ${nf(se,o.kind==='p'?5:4)} = ${nf(E,4)}`]});
  st.push({t:'Build the interval',why:'Go E below and E above the point estimate. Left = lower confidence limit (LCL), right = upper (UCL).',work:[`LCL = ${nf(mid,4)} − ${nf(E,4)} = ${fm(lo)}`,`UCL = ${nf(mid,4)} + ${nf(E,4)} = ${fm(hi)}`,`${fm(lo)} < ${o.kind==='p'?'p':'μ'} < ${fm(hi)}`],g:{mu:mid,sd:se,regions:[[lo,hi]],ci:[lo,hi],markers:[{x:mid,label:o.kind==='p'?'p̂':'x̄'}],showZ:false}});
  st.push({t:'Answer in words',why:'State the confidence level and what the interval is about.',work:[`We are ${o.cl}% confident that the true ${o.what} is between ${fm(lo)} and ${fm(hi)}.`]});
  return{title:o.title,text:o.text,steps:st,answer:`${fm(lo)} < ${o.kind==='p'?'p':'μ'} < ${fm(hi)}`,src:o.src}}
function wN(o){const st=[],z=ZC[o.cl];st.push({t:'Write what you know',why:'Find the confidence level, the allowed error E (as a decimal), and σ or p.',work:o.given.concat(['Find: the minimum sample size n'])});
  let raw;
  if(o.kind==='mean'){raw=(z*o.sd/o.E)**2;st.push({t:'Pick the formula',why:'You have σ and want a mean, so use the mean formula.',work:['n = (z·σ / E)²']});
    st.push({t:'Substitute',why:'Multiply z by σ, divide by E, then square the result.',work:[`n = (${z} × ${o.sd} / ${o.E})²`,`n = (${nf(z*o.sd/o.E,4)})² = ${nf(raw,4)}`]})}
  else{const p=o.p??.5,q=r2(1-p);raw=p*q*(z/o.E)**2;st.push({t:'Pick the formula',why:o.p==null?'It is a proportion and there is no earlier estimate, so use p = 0.5. That gives the biggest n, so your sample is surely big enough.':'It is a proportion and a previous study gives p, so use it.',work:['n = p̂q̂(z/E)²',`p̂ = ${p}, q̂ = ${q}`]});
    st.push({t:'Substitute',why:'Divide z by E, square it, then multiply by p̂q̂.',work:[`n = ${p} × ${q} × (${z}/${o.E})²`,`n = ${nf(p*q,4)} × ${nf((z/o.E)**2,4)} = ${nf(raw,4)}`]})}
  const n=Math.ceil(raw-1e-9);st.push({t:'Round UP',why:'Rounding down would give a sample a little too small to reach the error you want. Always go up, even from .01.',work:[`n = ${nf(raw,4)} → ${nf(n)}`]});
  return{title:o.title,text:o.text,steps:st,answer:`n = ${nf(n)}`,src:o.src}}
const W=(title,text,steps,answer,src)=>({title,text,steps,answer,src});

curve:{notes:[

 ['The 8 properties, explained','<ol><li><b>Bell-shaped</b>: high in the middle, low at the ends.</li><li><b>Mean = median = mode</b>: all three sit at the center peak. If they don\'t match, the data are skewed.</li><li><b>Unimodal</b>: only one peak.</li><li><b>Symmetric</b>: fold it at the mean and both halves match. So 50% is below the mean and 50% above.</li><li><b>Continuous</b>: no gaps; every value is possible.</li><li><b>Asymptotic</b>: the tails get closer and closer to the x-axis but never touch it. Extreme values are rare but not impossible.</li><li><b>Total area = 1.00 (100%)</b>: all probabilities add up to 1.</li><li><b>Empirical rule</b>: about 68% within 1 sd, 95% within 2 sd, 99.7% within 3 sd.</li></ol>'],

apply:{notes:[
 ['The full routine','Real problems are z-table problems with one extra step at the start: convert from real units to z.<ol><li>Write μ, σ, X.</li><li>Draw, shade.</li><li>z = (X − μ)/σ.</li><li>Look up A.</li><li>Pick the rule.</li><li>Answer + sentence.</li></ol>'],
 ['Wording dictionary','<table class="tbl"><tr><th>Words</th><th>Shade</th></tr><tr><td>less than, below, under, at most, no more than</td><td>left of X</td></tr><tr><td>more than, above, over, at least, no less than</td><td>right of X</td></tr><tr><td>between, from … to</td><td>between two values</td></tr><tr><td>top p%</td><td>right tail of area p</td></tr><tr><td>bottom p%</td><td>left tail of area p</td></tr></table>For continuous data, "less than" and "at most" give the same area.'],
 ['Probability, percent, or count?','A probability (0.0359) can be said as a percent (3.59%). If the question asks "how many out of 500", multiply: 500 × 0.0359 ≈ 18.'],
 ['Cutoffs (working backwards)','<ol><li>Top p% → tail area p. Area from mean to cutoff = 0.5 − p.</li><li>Find that area INSIDE the table → z (closest value).</li><li>Top → z positive. Bottom → z negative.</li><li>X = μ + zσ.</li></ol>'],
 ['How to solve','Read the question twice: underline the numbers, circle the direction word. Then follow the routine.']],
 worked:[
  wProb({title:'Pag-ibig salary loan (PPT)',text:'The average Pag-ibig salary loan for RFS Pharmacy employees is 23,000. If the debt is normally distributed with sd 2,500, find the probability that the employee owes less than 18,500.',mu:23000,sd:2500,region:[null,18500],given:['μ = 23,000','σ = 2,500','X = 18,500'],find:'P(X < 18,500)',say:'There is a %P chance an employee owes less than 18,500.',src:'PPT'}),

  W('UST Master\'s program cutoff (PPT)','To qualify for a Master\'s in Economics at UST, candidates must score in the top 20%. Mean 180, sd 25. Find the lowest possible score to qualify.',[

   {t:'Find the table area',why:'The table measures from the mean. The part between the mean and the cutoff is half minus the tail.',work:['0.5000 − 0.2000 = 0.3000']},

  wProb({title:'Same-side example',text:'Jeepney daily earnings average ₱2,500, sd ₱300. Find the probability that a driver earns between ₱2,650 and ₱3,100.',mu:2500,sd:300,region:[2650,3100],given:['μ = 2,500','σ = 300','X₁ = 2,650, X₂ = 3,100'],find:'P(2,650 < X < 3,100)',say:'%P of days earn between ₱2,650 and ₱3,100.'})]},
clt:{notes:[
 ['Population vs sample','The <b>population</b> is everyone (all LTO cars). A <b>sample</b> is the few you actually check (35 cars). From the sample we compute statistics like x̄, which we use to learn about population parameters like μ.'],
 ['Sampling distribution of x̄','Imagine taking every possible sample of 35 cars and computing x̄ each time. Those x̄ values form their own distribution, called the <b>sampling distribution of the sample mean</b>.'],
 ['Central Limit Theorem (CLT)','<ul><li>The bigger n is, the more the sampling distribution of x̄ looks normal.</li><li>Its center is the same μ.</li><li>Its spread is smaller: σx̄ = σ/√n, called the <b>standard error</b>.</li></ul>The CLT lets us use the z-table for sample means.'],
 ['Why averages spread less','One car might be 60 months or 180 months old. But the average of 35 cars almost never lands that far out, because old and new cars cancel each other. That is why we divide by √n.'],
 ['Sampling error','The gap between a sample statistic and the true parameter (x̄ − μ). It happens because a sample is never a perfect copy of the population.'],
 ['The key decision','<b>One value</b> (a person, a car) → z = (X − μ)/σ. <b>A sample mean</b> (the average of n) → z = (x̄ − μ)/(σ/√n). Look for words like "a sample of", "the mean of their", "average of the n".']],
 worked:[
  wProb({title:'Brand new car (PPT)',text:'The average cost per household of owning a brand new car is 5,000, sd 1,230. If 40 households are randomly selected, find the probability that the sample mean is more than 5,350.',mu:5000,sd:1230,n:40,region:[5350,null],given:['μ = 5,000','σ = 1,230','n = 40','x̄ = 5,350'],find:'P(x̄ > 5,350)',say:'There is a %P chance that the mean of 40 households is more than 5,350.',src:'PPT'}),
  wProb({title:'LTO car ages (PPT)',text:'The average age of a car registered in LTO is 120 months, sd 20. If 35 cars are selected, find the probability that the mean age is between 115 and 129 months.',mu:120,sd:20,n:35,region:[115,129],given:['μ = 120','σ = 20','n = 35','x̄₁ = 115, x̄₂ = 129'],find:'P(115 < x̄ < 129)',say:'%P of samples of 35 cars have a mean age from 115 to 129 months.',src:'PPT'}),
  wProb({title:'Fresh milk, one person (PPT a)',text:'A person drinks 18 liters of fresh milk a month on average, sd 4.5. Find the probability that a person selected at random drinks more than 16 liters.',mu:18,sd:4.5,region:[16,null],given:['μ = 18','σ = 4.5','X = 16 (one person, so no √n)'],find:'P(X > 16)',src:'PPT'}),

binom:{notes:[
 ['Binomial recap','A binomial experiment has a fixed number of trials n, each trial is success or failure, the chance of success p is the same every time, and trials are independent. X = number of successes. Example: pick 250 drivers, count how many have a professional license.'],
 ['Why approximate?','Exact binomial for "20 or more out of 300" means adding 281 terms. The normal curve gives nearly the same answer in a few lines. The CLT says that as n grows, the binomial looks more and more normal.'],
 ['Conditions','<div class="big">np ≥ 5 and nq ≥ 5</div>"≥" means "at least". If p is tiny or n is small, the bars are lopsided and the curve won\'t fit.'],
 ['Mean and sd','<div class="big">μ = np   σ = √(npq)   q = 1 − p</div>'],
 ['Continuity correction (the ±0.5)',`Counts are whole numbers, drawn as bars. The bar for 30 covers 29.5 to 30.5. The curve is continuous, so we move to the bar edges.${graph({mu:35,sd:5.49,bars:{on:[30,30]},regions:[[29.5,30.5]],showZ:false})}<b>Memory trick</b>: words with <b>"or"</b> (or more, or fewer, at least, at most) <b>include</b> the number, so you stretch to cover its whole bar. Words with <b>"than"</b> (more than, fewer than) <b>exclude</b> it, so you start past its bar.<table class="tbl" style="margin-top:8px"><tr><th>Binomial</th><th>Normal</th><th>Why</th></tr><tr><td>X = a</td><td>a − 0.5 &lt; X &lt; a + 0.5</td><td>just the one bar</td></tr><tr><td>X ≥ a</td><td>X &gt; a − 0.5</td><td>include a</td></tr><tr><td>X &gt; a</td><td>X &gt; a + 0.5</td><td>skip a</td></tr><tr><td>X ≤ a</td><td>X &lt; a + 0.5</td><td>include a</td></tr><tr><td>X &lt; a</td><td>X &lt; a − 0.5</td><td>skip a</td></tr></table>`],
 ['How to solve (PPT order)','1) Let p = …, q = …, n = …. 2) Check np ≥ 5 and nq ≥ 5. 3) μ = np, σ = √(npq). 4) Write the binomial notation and the corrected normal notation. 5) z, table, rule. 6) Answer.']],
 worked:[
  wProb({title:'LTO professional license (PPT)',text:'LTO reported that 14% of Filipino drivers have a professional driver\'s license. If 250 drivers are selected at random, find the probability that exactly 30 have one.',mu:35,sd:Math.sqrt(250*.14*.86),region:[29.5,30.5],binom:{n:250,p:.14,from:'P(X = 30)',to:'P(29.5 < X < 30.5)',why:'"Exactly 30" is one bar, from 29.5 to 30.5.',on:[30,30]},given:['p = 0.14 (drivers with a professional license)','q = 1 − 0.14 = 0.86','n = 250'],find:'P(X = 30)',say:'There is about a %P chance that exactly 30 of the 250 have a professional license.',src:'PPT'}),
  wProb({title:'Rotary Club (PPT)',text:'Of the members of the Rotary Club, 8% are single. If 300 Rotarians are selected, find the probability that 20 or more are single.',mu:24,sd:Math.sqrt(300*.08*.92),region:[19.5,null],binom:{n:300,p:.08,from:'P(X ≥ 20)',to:'P(X > 19.5)',why:'"20 or more" includes 20, so start at the left edge of its bar, 19.5.',on:[20,999]},given:['p = 0.08 (single)','q = 0.92','n = 300'],find:'P(X ≥ 20)',say:'The probability that 20 or more are single is %P. (The slide shows 0.8815; the sum 0.3315 + 0.5 is 0.8315.)',src:'PPT'}),

  wProb({title:'EEE, 660 or more',text:'Same survey. Find the probability that 660 or more prefer EEE.',mu:600,sd:Math.sqrt(480),region:[659.5,null],binom:{n:3000,p:.2,from:'P(X ≥ 660)',to:'P(X > 659.5)',why:'"660 or more" includes 660, so start at its left edge, 659.5.'},given:['p = 0.20, q = 0.80, n = 3,000'],find:'P(X ≥ 660)',say:'Only %P. If the 20% share were true, 660 or more would be rare, which hints the real share may be higher.'})]},
ciz:{notes:[
 ['What estimation is','Estimation is guessing a population <b>parameter</b> (like μ or p) from a sample. The formula we use (like x̄) is the <b>estimator</b>. The number it gives is the <b>estimate</b>.'],
 ['Point estimate','One single number. The best point estimate of μ is x̄. It is almost never exactly right, so we add a margin of error.'],
 ['Interval estimate and confidence interval','A range of values that probably contains the parameter. When you attach a confidence level (like 95%) to it, it is a <b>confidence interval</b>.'],
 ['What "95% confident" really means','If you repeated the sampling many times and built an interval each time, about 95% of those intervals would contain the true μ. It does NOT mean μ moves around.'],
 ['A good estimator','<ul><li><b>Unbiased</b>: on average it hits the parameter exactly.</li><li><b>Consistent</b>: bigger sample → closer to the parameter.</li><li><b>Relatively efficient</b>: of two unbiased ones, the one with smaller variance.</li></ul>'],
 ['Where 1.645, 1.960, 2.576 come from','The confidence level is the middle area. Half of it is the table area. 95% → 0.4750 → z = 1.96. 99% → 0.4950 → z = 2.575 (2.576). 90% → 0.4500 → 1.645.'],
 ['The formula','<div class="big">x̄ − z(σ/√n) &lt; μ &lt; x̄ + z(σ/√n)</div>E = z(σ/√n) is the maximum error of estimate. Use z when σ is known, or when n ≥ 30 (then s replaces σ).'],
 ['How to solve','1) Given: x̄, σ or s, n, confidence. 2) z or t? 3) Critical value. 4) σ/√n. 5) E. 6) x̄ ± E. 7) Sentence.']],
 worked:[
  wCI({title:'Flat TV (PPT)',text:'A survey of 30 households found the mean age of a flat TV is 4 years. Assuming σ = 0.75 year, find the best point estimate and the 99% confidence interval of the population mean.',kind:'z',known:true,xb:4,sd:.75,n:30,cl:99,given:['n = 30','x̄ = 4 years (this is the best point estimate)','σ = 0.75','99% confidence'],find:'99% CI for μ',what:'mean age of flat TVs',src:'PPT'}),
  wCI({title:'Clothing spending (PPT)',text:'A sample of 40 young professionals found mean monthly clothing spending of 500.00, sd 80.00. Find the best point estimate and the 95% confidence interval.',kind:'z',xb:500,sd:80,n:40,cl:95,given:['n = 40','x̄ = 500.00 (best point estimate)','s = 80.00','95% confidence'],find:'95% CI for μ',what:'mean monthly clothing spending',src:'PPT'}),

cit:{notes:[
 ['Why t?','When σ is unknown we use s. With a small sample, s can be off, so a z-interval would be too narrow. The t-distribution makes the interval a bit wider to cover that extra uncertainty.'],
 ['Properties of t','Bell-shaped and symmetric about 0, but flatter with thicker tails than z. Its shape depends on the degrees of freedom. As df grows, t gets closer to z. At df = ∞ it equals z.'],
 ['Degrees of freedom','<div class="big">df = n − 1</div>'],
 ['Decision flow','<table class="tbl"><tr><th>Situation</th><th>Use</th></tr><tr><td>σ known (any n)</td><td>z</td></tr><tr><td>σ unknown, n ≥ 30</td><td>z with s</td></tr><tr><td>σ unknown, n &lt; 30</td><td>t, df = n − 1</td></tr></table>'],
 ['Computing s by hand','<div class="big">s = √[ Σ(x − x̄)² / (n − 1) ]</div>Find x̄, subtract it from each value, square, add them up, divide by n − 1, square root. On the calculator use <b>sx</b> (or σn−1), not σx.'],
 ['How to solve','1) Check σ unknown and n &lt; 30. 2) df = n − 1. 3) t from the table. 4) s/√n. 5) E = t·s/√n. 6) x̄ ± E.']],
 worked:[
  wCI({title:'San Carlos College (PPT)',text:'A study of 19 students of San Carlos College showed a mean travel distance of 10.2 km, sd 2.3 km. Find the 99% confidence interval of the true mean.',kind:'t',xb:10.2,sd:2.3,n:19,cl:99,given:['n = 19','x̄ = 10.2 km','s = 2.3 km (sample sd, σ unknown)','99% confidence'],find:'99% CI for μ',what:'mean distance traveled',src:'PPT'}),
  wCI({title:'Family sizes (PPT)',text:'A random sample of families in a street gave sizes 5, 6, 7, 4, 3, 8, 2 and 9. Find the 95% confidence interval of the mean.',kind:'t',xb:5.5,sd:sdev([5,6,7,4,3,8,2,9]),n:8,cl:95,given:['data: 5, 6, 7, 4, 3, 8, 2, 9','n = 8','95% confidence'],find:'95% CI for μ',what:'mean family size',
   pre:[{t:'Compute x̄',why:'Add the values and divide by n.',work:['Σx = 5+6+7+4+3+8+2+9 = 44','x̄ = 44/8 = 5.5']},
    {t:'Compute s (by hand)',why:'Subtract x̄ from each value, square, add, divide by n − 1, take the root.',work:['(x − 5.5)²: 0.25, 0.25, 2.25, 2.25, 6.25, 6.25, 12.25, 12.25','Σ = 42','s = √(42/7) = √6 = 2.449']}],src:'PPT'})]},
cip:{notes:[
 ['Symbols','<ul><li>p = population proportion (unknown)</li><li>p̂ = sample proportion = X/n</li><li>X = how many in the sample have the trait</li><li>n = sample size</li><li>q̂ = 1 − p̂</li></ul>'],
 ['The formula','<div class="big">p̂ − z√(p̂q̂/n) &lt; p &lt; p̂ + z√(p̂q̂/n)</div>E = z√(p̂q̂/n) is the bound on the error of estimate. Proportions always use z.'],
 ['Reading the answer','A proportion is between 0 and 1. 0.349 &lt; p &lt; 0.451 means between 34.9% and 45.1%.'],
 ['How to solve','1) p̂ = X/n, q̂ = 1 − p̂. 2) z. 3) √(p̂q̂/n). 4) E. 5) p̂ ± E. 6) Sentence.']],
 worked:[
  wCI({title:'Engineering applicants (PPT)',text:'A sample of 350 engineering applicants included 140 women. Find the 95% confidence interval of the true proportion of women.',kind:'p',X:140,n:350,cl:95,given:['n = 350','X = 140 women','95% confidence'],find:'95% CI for p',what:'proportion of women applicants',src:'PPT'}),
  wCI({title:'Voters for candidate B (PPT)',text:'A random sample of 420 voters produced 231 in favor of candidate B. Estimate the fraction favoring B and place a bound on the error using 99% confidence.',kind:'p',X:231,n:420,cl:99,given:['n = 420','X = 231','99% confidence'],find:'p̂, E, and the 99% CI',what:'proportion of voters favoring B',src:'PPT'})]},
n:{notes:[
 ['Where the formula comes from','Start with E = z·σ/√n and solve for n: √n = zσ/E, so <div class="big">n = (zσ/E)²</div>For proportions, E = z√(pq/n) gives <div class="big">n = p̂q̂(z/E)²</div>'],
 ['What each piece does','Higher confidence (bigger z) → bigger n. Bigger σ (more spread) → bigger n. Smaller E (more precise) → much bigger n, because E is squared. Halving E makes n 4 times as large.'],
 ['When there\'s no p','Use p = 0.5. p × q is largest at 0.5 × 0.5 = 0.25, so you get the biggest, safest sample size.'],
 ['Round up, always','17.64 → 18. 600.25 → 601. Even 1840.02 → 1841. You can\'t survey part of a person, and rounding down misses the target.'],
 ['How to solve','1) Mean (σ given) or proportion (percent given)? 2) z. 3) E as a decimal (3% = 0.03). 4) Substitute. 5) Round up.']],

const FORMULAS=`<table class="tbl fs"><tr><th>Topic</th><th>Formula</th><th>Use when</th></tr>
<tr><td>z-score</td><td>z = (X − μ)/σ</td><td>one value</td></tr><tr><td>From z to X</td><td>X = μ + zσ</td><td>cutoffs</td></tr>
<tr><td>Pearson's Index</td><td>PI = 3(x̄ − median)/s</td><td>normal if −1 ≤ PI ≤ 1</td></tr>
<tr><td>Areas</td><td>tail 0.5 − A · big side 0.5 + A</td><td>table gives 0 to z</td></tr>
<tr><td>Sample mean</td><td>z = (x̄ − μ)/(σ/√n)</td><td>mean of n values</td></tr>
<tr><td>Binomial → normal</td><td>μ = np, σ = √(npq), ±0.5</td><td>np ≥ 5 and nq ≥ 5</td></tr>
<tr><td>CI mean (z)</td><td>x̄ ± z(σ/√n)</td><td>σ known or n ≥ 30</td></tr>
<tr><td>CI mean (t)</td><td>x̄ ± t(s/√n), df = n − 1</td><td>σ unknown, n &lt; 30</td></tr>
<tr><td>CI proportion</td><td>p̂ ± z√(p̂q̂/n)</td><td>p̂ = X/n</td></tr>
<tr><td>Sample size (mean)</td><td>n = (zσ/E)²</td><td>round up</td></tr>
<tr><td>Sample size (prop.)</td><td>n = p̂q̂(z/E)²</td><td>p = 0.5 if unknown</td></tr>
<tr><td>Critical z</td><td>90% 1.645 · 95% 1.960 · 99% 2.576</td><td></td></tr></table>`;
