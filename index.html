const $=id=>document.getElementById(id);
const R=fn=>fn._r||(fn._r=(()=>{let p=0;return()=>{if(p)return;p=requestAnimationFrame(()=>{p=0;fn()})}})());
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const plain=h=>{const d=document.createElement('div');d.innerHTML=h;return d.textContent.replace(/\s+/g,' ').trim()};
const store={get(k,d){try{const v=localStorage.getItem('zlab:'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('zlab:'+k,JSON.stringify(v))}catch(e){}}};
const LV=['easy','medium','hard'],LVN={easy:'Easy',medium:'Medium',hard:'Hard'},SECT=['learn','examples','how','test'],SECTN={learn:'1 · Learn',examples:'2 · Worked solutions',how:'3 · How to solve',test:'4 · Test yourself'};
let S={mode:store.get('mode','practice'),view:store.get('view','home'),topic:store.get('topic',0),sect:'learn',level:'easy',q:0,sets:store.get('sets',{})};
let done=store.get('done',{}); // key -> 'first' | 'solved' | 'shown'
const qstate={}; // runtime: key -> {strikes, status, vals, wrong:[]}
const pads={};   // key -> {strokes, transcript}
let SAMPLE=null,SAMPLE_READY=false;
try{window.claude?.use?.('sample').then(s=>{SAMPLE=s;SAMPLE_READY=true}).catch(()=>{SAMPLE_READY=true})}catch(e){SAMPLE_READY=true}

// ---------- question bank ----------
const cache={};
function questions(ti,lv){const set=S.sets[ti+lv]||0,k=ti+'|'+lv+'|'+set;if(cache[k])return cache[k];
  const T=TOPICS[ti],tpl=T.gen[lv],r=RNG(hash(T.id+lv+set)),out=[];
  for(let i=0;i<10;i++){let q;for(let tries=0;tries<5&&!q;tries++){try{q=tpl[i%tpl.length](r)}catch(e){console.error(e)}}out.push(q)}
  return cache[k]=out}
const qkey=(ti,lv,i)=>`${TOPICS[ti].id}|${lv}|${S.sets[ti+lv]||0}|${i}`;
const topicDone=ti=>{let n=0;LV.forEach(lv=>{for(let i=0;i<10;i++)if(done[qkey(ti,lv,i)])n++});return n};

// ---------- top-level render ----------
function save(){store.set('mode',S.mode);store.set('view',S.view);store.set('topic',S.topic);store.set('sets',S.sets)}
function render(){save();renderNav();document.querySelectorAll('#mode button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.mode===S.mode));
  if(S.mode==='study'){S.view==='home'?renderStudyHome():renderStudy(TOPICS[S.topic])}else{S.view==='home'?renderHome():renderTopic()}}
document.querySelectorAll('#mode button').forEach(b=>b.onclick=()=>{S.mode=b.dataset.mode;render();scrollTo(0,0)});
let COVER=store.get('cover',false);
function renderStudyHome(){
  let h=`<section class="card hero"><div class="eyebrow">Study mode</div><h2>Read the full lesson, then watch every problem get solved.</h2>
   <p>Each topic has longer notes and the PPT problems worked out line by line. Every step shows <b>what to write on your paper</b> and <b>why you do it</b>. Turn on <b>Cover the work</b> to hide the answers and reveal one step at a time, like a flashcard.</p></section>
   <section class="card"><div class="eyebrow">Formula sheet</div><div class="gbox">${FORMULAS}</div></section><div class="grid">`;
  let unit='';TOPICS.forEach((t,i)=>{if(t.unit!==unit){unit=t.unit;h+=`<div class="gridunit eyebrow">${unit}</div>`}h+=`<button class="tcard" data-t="${i}"><span class="tnum">${i+1}</span><span class="tname">${t.name}</span><span class="mute small">${STUDY[t.id].notes.length} notes · ${STUDY[t.id].worked.length} worked solutions</span></button>`});
  $('main').innerHTML=h+'</div>';$('main').querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{S.view='topic';S.topic=+b.dataset.t;render();scrollTo(0,0)})}
function renderStudy(T){
  const D=STUDY[T.id];
  let h=`<div class="thead"><div class="eyebrow">Study · ${T.unit} · Topic ${S.topic+1} of ${TOPICS.length}</div><h2>${T.name}</h2></div>
   <div class="toc">${D.notes.map((n,i)=>`<a href="#" data-go="n${i}">${n[0]}</a>`).join('')}<a href="#" data-go="ws">Worked solutions (${D.worked.length})</a></div>`;
  h+=D.notes.map((n,i)=>`<section class="card" id="n${i}"><div class="eyebrow">${n[0]}</div><div class="prose">${n[1]}</div></section>`).join('');
  h+=`<div class="row between" id="ws"><h3>Worked solutions</h3><label class="tog"><input type="checkbox" id="cover" ${COVER?'checked':''}> Cover the work (try first)</label></div>`;
  h+=D.worked.map((w,i)=>`<section class="card sheet"><div class="eyebrow">Solution ${i+1} · ${w.title}</div><p class="qtext">${w.text}</p>
    <div class="stps">${w.steps.map((s,k)=>`<div class="stp"><div class="snum">${k+1}</div><div class="sbody"><h4>${s.t}</h4><p class="why">${s.why}</p>${s.work&&s.work.filter(Boolean).length?`<div class="work ${COVER?'hid':''}" tabindex="0" role="button" aria-label="Reveal step">${s.work.filter(Boolean).map(l=>`<div>${l}</div>`).join('')}</div>`:''}${s.g?`<div class="gbox">${graph(s.g)}</div>`:''}</div></div>`).join('')}</div>
    <div class="ans ${COVER?'hid':''}" tabindex="0" role="button">Answer: <b>${w.answer}</b></div></section>`).join('');
  h+=`<div class="row end"><button class="sec" id="toprac">Practice this topic →</button>${S.topic<TOPICS.length-1?'<button class="pri" id="nexttopic">Next topic →</button>':''}</div>`;
  $('main').innerHTML=h;
  $('main').querySelectorAll('[data-go]').forEach(a=>a.onclick=e=>{e.preventDefault();$(a.dataset.go).scrollIntoView({block:'start'})});
  $('main').querySelectorAll('.hid').forEach(el=>{const show=()=>el.classList.remove('hid');el.onclick=show;el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();show()}}});
  $('cover').onchange=e=>{COVER=e.target.checked;store.set('cover',COVER);const y=$('ws').getBoundingClientRect().top;renderStudy(T);scrollBy(0,$('ws').getBoundingClientRect().top-y)};
  $('toprac').onclick=()=>{S.mode='practice';S.sect='test';S.level='easy';S.q=0;render();scrollTo(0,0)};
  if($('nexttopic'))$('nexttopic').onclick=()=>{S.topic++;render();scrollTo(0,0)}}
function renderNav(){
  let h=`<button class="chip ${S.view==='home'?'on':''}" data-home="1">Overview</button>`;
  let unit='';TOPICS.forEach((t,i)=>{if(t.unit!==unit){unit=t.unit;h+=`<span class="navunit">${unit}</span>`}
    h+=`<button class="chip ${S.view==='topic'&&S.topic===i?'on':''}" data-t="${i}">${i+1}. ${t.name}<span class="cnt">${topicDone(i)}/30</span></button>`});
  $('nav').innerHTML=h;
  $('nav').querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{S.view='topic';S.topic=+b.dataset.t;S.sect='learn';S.q=0;render();scrollTo(0,0)});$('nav').querySelectorAll('.cnt').forEach(c=>c.hidden=S.mode==='study');
  $('nav').querySelector('[data-home]').onclick=()=>{S.view='home';render()};
  const nav=$('nav'),on=nav.querySelector('.on');if(on){const left=on.offsetLeft-nav.clientWidth/2+on.offsetWidth/2;nav.scrollLeft=Math.max(0,left)}}

function renderHome(){
  const total=TOPICS.reduce((s,_,i)=>s+topicDone(i),0);
  let h=`<section class="card hero"><div class="eyebrow">ECON3169 · Finals reviewer</div><h2>Learn it, see it solved, then solve it yourself.</h2>
  <p>Each topic follows the same path: <b>Learn</b> the idea in plain words, read the <b>worked solutions</b> from your PPT, follow the <b>how-to-solve</b> checklist, then <b>test yourself</b> on 30 questions (10 easy, 10 medium, 10 hard). Miss a question 3 times and the full solution appears. Use <b>Write by hand</b> under any question to solve with your mouse or finger, then turn it into text.</p>
  <div class="meter"><span style="width:${total/3}%"></span></div><p class="mute">${total} of 300 questions solved</p></section><div class="grid">`;
  let unit='';TOPICS.forEach((t,i)=>{if(t.unit!==unit){unit=t.unit;h+=`<div class="gridunit eyebrow">${unit}</div>`}const d=topicDone(i);
    h+=`<button class="tcard" data-t="${i}"><span class="tnum">${i+1}</span><span class="tname">${t.name}</span><span class="meter sm"><span style="width:${d/30*100}%"></span></span><span class="mute small">${d}/30 solved</span></button>`});
  h+=`</div><section class="card"><div class="eyebrow">Exam reminders</div><ul>
   <li>Always draw the curve and shade before touching the table.</li><li>The z-table gives the area from 0 to z. Tails are 0.5 − A.</li>
   <li>Sample means: divide σ by √n. Binomial: check np ≥ 5 and nq ≥ 5, then use ±0.5.</li><li>CI: z for σ known or n ≥ 30, t (df = n − 1) for σ unknown and n &lt; 30.</li><li>Sample size: always round up.</li></ul></section>`;
  $('main').innerHTML=h;$('main').querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{S.view='topic';S.topic=+b.dataset.t;S.sect='learn';render();scrollTo(0,0)})}

function renderTopic(){
  const T=TOPICS[S.topic];
  let h=`<div class="thead"><div class="eyebrow">${T.unit} · Topic ${S.topic+1} of ${TOPICS.length}</div><h2>${T.name}</h2></div>
   <div class="steps" role="tablist">${SECT.map(s=>`<button role="tab" aria-selected="${S.sect===s}" data-s="${s}">${SECTN[s]}</button>`).join('')}</div><div id="sect"></div>`;
  $('main').innerHTML=h;$('main').querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{S.sect=b.dataset.s;renderTopic()});
  ({learn:renderLearn,examples:renderExamples,how:renderHow,test:renderTest})[S.sect](T,$('sect'))}
const nextBtn=(label,sect)=>`<div class="row end"><button class="pri" data-next="${sect}">${label} →</button></div>`;
function wireNext(el){el.querySelectorAll('[data-next]').forEach(b=>b.onclick=()=>{S.sect=b.dataset.next;renderTopic();scrollTo(0,0)})}

function renderLearn(T,el){
  el.innerHTML=T.learn.map(([h,t])=>`<section class="card"><div class="eyebrow">${h}</div><div class="prose">${t}</div></section>`).join('')+(T.play?`<section class="card"><div class="eyebrow">Play with it</div><div id="pg"></div></section>`:'')+`<div class="row between"><button class="ghost" id="tostudy">Read the full study notes</button><button class="pri" data-next="examples">See worked solutions →</button></div>`;
  if(T.play)PLAY[T.play]($('pg'));wireNext(el);$('tostudy').onclick=()=>{S.mode='study';render();scrollTo(0,0)}}

function renderExamples(T,el){
  el.innerHTML=T.examples.map((x,i)=>`<section class="card"><div class="eyebrow">Example ${i+1} · ${x.title}</div><p class="qtext">${x.text}</p>${x.graph?`<div class="gbox">${graph(x.graph)}</div>`:''}
    <ol class="sol" id="ex${i}"></ol><div class="row"><button class="sec" data-ex="${i}">Show next step</button><button class="ghost" data-all="${i}">Show all</button></div><div class="ans" id="exa${i}" hidden>Answer: <b>${x.answer}</b></div></section>`).join('')+nextBtn('How to solve','how');
  const shown={};
  const step=(i,all)=>{const x=T.examples[i];shown[i]=all?x.steps.length:(shown[i]||0)+1;$('ex'+i).innerHTML=x.steps.slice(0,shown[i]).map(s=>`<li>${s}</li>`).join('');
    if(shown[i]>=x.steps.length){$('exa'+i).hidden=false;el.querySelector(`[data-ex="${i}"]`).hidden=true;el.querySelector(`[data-all="${i}"]`).hidden=true}};
  el.querySelectorAll('[data-ex]').forEach(b=>b.onclick=()=>step(+b.dataset.ex));el.querySelectorAll('[data-all]').forEach(b=>b.onclick=()=>step(+b.dataset.all,true));wireNext(el)}

function renderHow(T,el){
  el.innerHTML=`<section class="card"><div class="eyebrow">The routine</div><ol class="sol big-ol">${T.how.steps.map(s=>`<li>${s}</li>`).join('')}</ol></section>
   <section class="card"><div class="eyebrow">Formula to remember</div><div class="big">${T.how.formula}</div></section>
   <section class="card warn"><div class="eyebrow">Common mistakes</div><ul>${T.how.mistakes.map(s=>`<li>${s}</li>`).join('')}</ul></section>`+nextBtn('Start the test','test');wireNext(el)}

// ---------- test ----------
function renderTest(T,el){
  const qs=questions(S.topic,S.level);
  const lvCount=lv=>{let n=0;for(let i=0;i<10;i++)if(done[qkey(S.topic,lv,i)])n++;return n};
  el.innerHTML=`<div class="row between"><div class="seg">${LV.map(lv=>`<button aria-pressed="${S.level===lv}" data-lv="${lv}">${LVN[lv]} <span class="cnt">${lvCount(lv)}/10</span></button>`).join('')}</div><button class="ghost" id="newset">New set of questions</button></div>
   <div class="dots">${qs.map((_,i)=>{const d=done[qkey(S.topic,S.level,i)];return`<button class="qd ${i===S.q?'cur':''} ${d||''}" data-q="${i}" aria-label="Question ${i+1}">${i+1}</button>`}).join('')}</div><div id="qbox"></div>`;
  el.querySelectorAll('[data-lv]').forEach(b=>b.onclick=()=>{S.level=b.dataset.lv;S.q=0;renderTest(T,el)});
  el.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{S.q=+b.dataset.q;renderTest(T,el)});
  $('newset').onclick=()=>{S.sets[S.topic+S.level]=(S.sets[S.topic+S.level]||0)+1;S.q=0;save();renderTest(T,el)};
  renderQ(T,qs[S.q],$('qbox'),()=>{renderNav();const qs2=el.querySelector('.dots');qs2&&qs2.querySelectorAll('[data-q]').forEach((b,i)=>{const d=done[qkey(S.topic,S.level,i)];b.className=`qd ${i===S.q?'cur':''} ${d||''}`});el.querySelectorAll('[data-lv] .cnt').forEach((c,j)=>c.textContent=lvCount(LV[j])+'/10')},()=>{if(S.q<9){S.q++;renderTest(T,el)}else{const i=LV.indexOf(S.level);if(i<2){S.level=LV[i+1];S.q=0;renderTest(T,el)}else if(S.topic<TOPICS.length-1){S.topic++;S.sect='learn';S.level='easy';S.q=0;render()}}scrollTo({top:$('main').offsetTop-10})})}

function parseNum(s){if(s==null)return NaN;s=String(s).trim().replace(/[₱\s]/g,'').replace(/,/g,'').replace(/[−–]/g,'-');const pct=s.endsWith('%');if(pct)s=s.slice(0,-1);let v=parseFloat(s);return pct?v/100:v}
function normVal(v,f,raw){if(isNaN(v))return v;if(f.type==='prob'&&v>1&&v<=100)return v/100;if(f.type==='pct'&&f.ans>=1&&v>0&&v<1&&!String(raw).includes('%'))return v*100;if(f.type==='pct'&&String(raw).includes('%'))return v*100;return v}

function renderQ(T,q,box,onChange,onNext){
  if(!q){box.innerHTML='<div class="card">This question could not be made. Press "New set of questions".</div>';return}
  const key=qkey(S.topic,S.level,S.q),st=qstate[key]||(qstate[key]={strikes:0,status:done[key]?'done':'open',vals:[],wrong:[]});
  const isMC=!!q.choices;
  box.innerHTML=`<section class="card qcard"><div class="row between"><div class="eyebrow">${LVN[S.level]} · Question ${S.q+1} of 10</div><div class="lives" title="Tries left">${[0,1,2].map(k=>`<span class="dot ${k<3-st.strikes?'':'off'}"></span>`).join('')}</div></div>
    <div class="qtext">${q.text}</div>${q.graph?`<div class="gbox" id="g">${graph(q.graph)}</div>`:''}
    ${isMC?`<div class="choices">${q.choices.map((c,i)=>`<button class="choice" data-c="${i}">${esc(c)}</button>`).join('')}</div>`:
      `<div class="fields">${q.fields.map((f,i)=>`<label class="field"><span>${f.label}</span><span class="inwrap"><input type="text" id="f${i}" inputmode="decimal" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="done" value="${esc(st.vals[i]??'')}">${['prob','pct','n'].includes(f.type)?'':`<button type="button" class="pm" data-for="f${i}" aria-label="Switch plus or minus">±</button>`}</span></label>`).join('')}<button class="pri" id="chk">Check</button></div>`}
    <div id="fb" aria-live="polite"></div>
    <div class="row"><button class="ghost" id="padbtn" aria-expanded="false">✎ Write by hand</button><button class="ghost" id="giveup">Show me how</button></div>
    <div id="padwrap" hidden></div></section>`;
  const fb=$('fb'),gEl=$('g');
  const lives=()=>box.querySelectorAll('.lives .dot').forEach((d,k)=>d.classList.toggle('off',k>=3-st.strikes));
  const finish=(how)=>{st.status='done';if(!done[key]||how==='first'){done[key]=how;store.set('done',done)}
    if(gEl)gEl.innerHTML=graph(q.after||q.graph);box.querySelectorAll('input,.choice,#chk,.pm').forEach(e=>e.disabled=true);$('giveup').hidden=true;onChange()};
  const showSol=(title,cls)=>{const ansTxt=isMC?q.choices[q.correct]:q.fields.map(f=>`${f.label}: ${typeof f.ans==='number'?nf(f.ans,4):f.ans}`).join(' · ');
    fb.innerHTML=`<div class="fb ${cls}"><b>${title}</b><div class="anskey">Answer: ${esc(ansTxt)}</div><div class="eyebrow" style="margin-top:8px">How to solve it</div><ol class="sol">${q.steps.map(s=>`<li>${s}</li>`).join('')}</ol></div><div class="row end"><button class="pri" id="nq">Next question →</button></div>`;
    $('nq').onclick=onNext;if(isMC)box.querySelectorAll('.choice')[q.correct].classList.add('right')};
  if(st.status==='done'){showSol(done[key]==='shown'?'Solution':'You solved this','ok');finish(done[key])}
  // live graph
  if(!isMC&&q.live&&gEl){const upd=R(()=>{const v=q.fields.map((f,i)=>normVal(parseNum($('f'+i).value),f,$('f'+i).value));if(st.status!=='done'&&v.some(x=>!isNaN(x)))gEl.innerHTML=graph(q.live(v))});q.fields.forEach((_,i)=>$('f'+i).addEventListener('input',upd));if(st.vals.length)upd()}
  if(!isMC)q.fields.forEach((_,i)=>$('f'+i).addEventListener('input',e=>st.vals[i]=e.target.value));
  const miss=(msg)=>{st.strikes++;lives();
    if(st.strikes>=3){showSol('3 misses. Here is the full solution. Read it, then try a new set later.','rev');finish('shown');return}
    fb.innerHTML=`<div class="fb no"><b>Not yet.</b> ${msg||''} ${3-st.strikes} ${3-st.strikes===1?'try':'tries'} left.<div class="hint">Hint: ${q.hint||'Go back to the how-to-solve steps.'}</div></div>`};
  if(isMC){box.querySelectorAll('.choice').forEach(b=>{const i=+b.dataset.c;if(st.wrong.includes(i)){b.classList.add('wrong');b.disabled=true}
    b.onclick=()=>{if(st.status==='done')return;if(i===q.correct){b.classList.add('right');showSol(st.strikes?'Correct.':'Correct on the first try.','ok');finish(st.strikes?'solved':'first')}else{st.wrong.push(i);b.classList.add('wrong');b.disabled=true;miss()}}})}
  else{const check=()=>{if(st.status==='done')return;const vals=q.fields.map((f,i)=>normVal(parseNum($('f'+i).value),f,$('f'+i).value));
      if(vals.some(isNaN)){fb.innerHTML=`<div class="fb no">Type a number in ${q.fields.length>1?'every box':'the box'} first.</div>`;return}
      const ok=q.fields.map((f,i)=>Math.abs(vals[i]-f.ans)<=f.tol+1e-9);
      q.fields.forEach((f,i)=>$('f'+i).classList.toggle('bad',!ok[i]));q.fields.forEach((f,i)=>$('f'+i).classList.toggle('good',ok[i]));
      if(ok.every(Boolean)){showSol(st.strikes?'Correct.':'Correct on the first try.','ok');finish(st.strikes?'solved':'first');return}
      let msg='';q.fields.forEach((f,i)=>{if(!ok[i]&&f.type==='n'&&f.raw&&vals[i]>=Math.floor(f.raw)-.01&&vals[i]<f.ans)msg='Close. Sample size is always rounded UP.'});
      if(!msg&&q.fields.length>1)msg=q.fields.filter((f,i)=>ok[i]).map(f=>f.label).join(', ')?`${q.fields.filter((f,i)=>ok[i]).map(f=>f.label).join(', ')} ${q.fields.filter((f,i)=>ok[i]).length>1?'are':'is'} right.`:'';
      if(!msg&&q.fields.some(f=>f.type==='prob')&&vals.some(v=>v<0||v>1))msg='A probability is between 0 and 1.';
      miss(msg)};
    $('chk').onclick=check;q.fields.forEach((_,i)=>$('f'+i).addEventListener('keydown',e=>{if(e.key==='Enter')check()}))}
  $('giveup').onclick=()=>{if(st.status==='done')return;st.strikes=3;lives();showSol('Here is how to solve it.','rev');finish('shown')};
  $('padbtn').onclick=()=>{const w=$('padwrap');w.hidden=!w.hidden;if(pads[key])pads[key].open=!w.hidden;$('padbtn').setAttribute('aria-expanded',!w.hidden);if(!w.hidden&&!w.dataset.ready){w.dataset.ready=1;makePad(w,key,q)}};
  if(pads[key]&&pads[key].open){$('padbtn').click()}}

// ---------- handwriting pad ----------
function makePad(w,key,q){
  const P=pads[key]||(pads[key]={strokes:[],transcript:'',open:true});P.open=true;
  w.innerHTML=`<div class="padtools"><div class="seg"><button aria-pressed="true" data-tool="pen">Pen</button><button aria-pressed="false" data-tool="erase">Eraser</button></div><button class="ghost" id="undo">Undo</button><button class="ghost" id="clr">Clear</button></div>
   <div class="paper"><canvas id="cv" aria-label="Handwriting area"></canvas></div>
   <div class="row"><button class="pri" id="ocr">Turn into text</button><span class="mute small" id="ocrst"></span></div>
   <label class="field wide"><span>Your work as text (you can edit it)</span><textarea id="tx" rows="5" placeholder="Your handwriting shows up here as text.">${esc(P.transcript)}</textarea></label>
   <div class="row"><button class="ghost" id="cp">Copy text</button><button class="ghost" id="use" ${q.choices?'hidden':''}>Put my answer in the box</button><button class="sec" id="chkwork">Check my work</button></div><div id="wf"></div>`;
  const cv=$('cv'),ctx=cv.getContext('2d');let tool='pen',cur=null;const DPR=Math.max(1,window.devicePixelRatio||1);
  const size=()=>{const W=cv.parentElement.clientWidth,H=Math.max(260,Math.min(420,W*.6));cv.style.height=H+'px';cv.width=W*DPR;cv.height=H*DPR;redraw()};
  const seg=(s)=>{ctx.globalCompositeOperation=s.t==='erase'?'destination-out':'source-over';ctx.strokeStyle='#18222d';ctx.lineWidth=(s.t==='erase'?22:2.6)*DPR;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();s.p.forEach((pt,i)=>i?ctx.lineTo(pt[0]*DPR,pt[1]*DPR):ctx.moveTo(pt[0]*DPR,pt[1]*DPR));if(s.p.length===1)ctx.lineTo(s.p[0][0]*DPR+.1,s.p[0][1]*DPR);ctx.stroke()};
  const redraw=()=>{ctx.clearRect(0,0,cv.width,cv.height);P.strokes.forEach(seg);ctx.globalCompositeOperation='source-over'};
  const pos=e=>{const b=cv.getBoundingClientRect();return[e.clientX-b.left,e.clientY-b.top]};
  cv.addEventListener('pointerdown',e=>{e.preventDefault();cv.setPointerCapture(e.pointerId);cur={t:tool,p:[pos(e)]};P.strokes.push(cur);seg(cur)});
  cv.addEventListener('pointermove',e=>{if(!cur)return;const evs=e.getCoalescedEvents?e.getCoalescedEvents():[e];evs.forEach(ev=>cur.p.push(pos(ev)));const last=cur.p.slice(-evs.length-1);seg({t:cur.t,p:last})});
  const end=()=>{cur=null;ctx.globalCompositeOperation='source-over'};cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);
  w.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>{tool=b.dataset.tool;w.querySelectorAll('[data-tool]').forEach(x=>x.setAttribute('aria-pressed',x===b))});
  $('undo').onclick=()=>{P.strokes.pop();redraw()};$('clr').onclick=()=>{P.strokes=[];redraw()};
  $('tx').oninput=e=>P.transcript=e.target.value;
  new ResizeObserver(()=>size()).observe(cv.parentElement);size();
  const st=$('ocrst');
  const errMsg=c=>({not_granted:'Claude access was not allowed for this page.',images_unavailable:'This view cannot send pictures to Claude. Open the page in the Claude app or claude.ai.',rate_limited:'Too many requests right now. Wait a bit and try again.',session_expired:'Sign in to Claude again, then retry.',sampling_disabled:'Claude is not available for this account.',refused:'Claude could not read this. Try writing it again.'}[c]||'Something went wrong. Try again.');
  $('ocr').onclick=async()=>{
    if(!P.strokes.length){st.textContent='Write something first.';return}
    if(!SAMPLE){st.textContent=SAMPLE_READY?'Handwriting reading works when this page is opened in Claude (claude.ai or the Claude app).':'Connecting to Claude… try again in a few seconds.';return}
    const ex=document.createElement('canvas');ex.width=cv.width;ex.height=cv.height;const x=ex.getContext('2d');x.fillStyle='#ffffff';x.fillRect(0,0,ex.width,ex.height);x.drawImage(cv,0,0);
    const blob=await new Promise(r=>ex.toBlob(r,'image/png'));$('ocr').disabled=true;st.textContent='Reading your handwriting…';
    try{const res=await SAMPLE.json(`The image is a student's handwritten statistics work for this question:\n"${plain(q.text)}"\n\nTranscribe exactly what the student wrote, line by line, as plain text. Keep their numbers and mistakes as written; do not solve or correct anything. Write symbols as: μ, σ, x̄, p̂, √( ), ², ≤, ≥, ×, ÷. Then give the final answer number(s) the student wrote, in order, if any.\nReply with only JSON: {"transcript": "line 1\\nline 2", "final_answers": ["0.0359"]}`,{images:[blob],cache:false});
      P.transcript=String(res.transcript||'');$('tx').value=P.transcript;P.finals=Array.isArray(res.final_answers)?res.final_answers:[];st.textContent=P.finals.length?'Done. Final answer found: '+P.finals.join(', '):'Done.'}
    catch(e){st.textContent=errMsg(e.code)}finally{$('ocr').disabled=false}};
  $('cp').onclick=async()=>{try{await navigator.clipboard.writeText($('tx').value);st.textContent='Copied.'}catch(e){$('tx').select();st.textContent='Press Ctrl+C (or long-press) to copy the selected text.'}};
  $('use').onclick=()=>{let nums=(P.finals&&P.finals.length?P.finals:[]).map(String);if(!nums.length){const m=$('tx').value.match(/-?\d[\d,]*\.?\d*/g);nums=m?m.slice(-q.fields.length):[]}
    if(!nums.length){st.textContent='No number found in your work.';return}
    q.fields.forEach((f,i)=>{const el=$('f'+i);if(el&&nums[i]!=null&&!el.disabled){el.value=nums[i].replace(/[^\d.,\-%]/g,'');el.dispatchEvent(new Event('input'))}});st.textContent='Answer placed. Press Check.'};
  $('chkwork').onclick=async()=>{const wf=$('wf'),work=$('tx').value.trim();if(!work){wf.innerHTML='<div class="fb no">Turn your writing into text first (or type your work in the box).</div>';return}
    if(!SAMPLE){wf.innerHTML='<div class="fb no">Checking your work needs this page to be opened in Claude.</div>';return}
    const ansTxt=q.choices?q.choices[q.correct]:q.fields.map(f=>`${f.label} = ${f.ans}`).join('; ');
    wf.innerHTML='<div class="fb rev">Checking…</div>';$('chkwork').disabled=true;
    try{await SAMPLE(`You are a friendly statistics tutor for a beginner. Question: "${plain(q.text)}"\nCorrect method: ${q.steps.map(plain).join(' ')}\nCorrect answer: ${ansTxt}\n\nStudent's work:\n${work}\n\nIn 2 to 4 short, plain sentences: say whether the method and numbers are right, and point to the FIRST mistake with a nudge on how to fix it. Do not reveal the correct final answer unless the student already got it. Small rounding differences are fine.`,{cache:false,onText:({text})=>{wf.innerHTML=`<div class="fb rev">${esc(text)}</div>`}})}
    catch(e){wf.innerHTML=`<div class="fb no">${errMsg(e.code)}</div>`}finally{$('chkwork').disabled=false}}}

// ---------- playgrounds ----------
const numIn=(id,label,val)=>`<label class="field"><span>${label}</span><span class="inwrap"><input type="text" id="${id}" inputmode="decimal" autocomplete="off" value="${val}"><button type="button" class="pm" data-for="${id}" aria-label="Switch plus or minus">±</button></span></label>`;
const rd=(id,d)=>{const v=parseNum($(id).value);return isNaN(v)?d:v};
const PLAY={
 bands(el){el.innerHTML=`<div class="gbox" id="pgg"></div><div class="fields"><label class="field"><span>From (sd)</span><input type="range" id="b1" min="-3" max="3" value="-1"></label><label class="field"><span>To (sd)</span><input type="range" id="b2" min="-3" max="3" value="1"></label></div><div class="big" id="pgo"></div>`;
  const u=()=>{let a=+$('b1').value,b=+$('b2').value;if(a>b)[a,b]=[b,a];$('pgg').innerHTML=graph({regions:[[a,b]]});$('pgo').textContent=a===b?'Pick two different edges.':`From z = ${a} to z = ${b}: ${band(a,b)}% of the data`};$('b1').oninput=R(u);$('b2').oninput=R(u);u()},
 zscore(el){el.innerHTML=`<p class="mute small">Type any numbers from −100,000 to 100,000 (σ above 0).</p><div class="gbox" id="pgg"></div><div class="fields">${numIn('p1','Mean μ',70)}${numIn('p2','σ',10)}${numIn('p3','Value X',85)}</div><div class="big" id="pgo"></div>`;
  const u=()=>{const c=(v,a,b)=>Math.min(b,Math.max(a,v));const mu=c(rd('p1',70),-1e5,1e5),sd=c(rd('p2',10),.01,1e5),x=c(rd('p3',85),-1e5,1e5);$('pgg').innerHTML=graph({mu,sd,markers:[{x,label:nf(x)}],regions:[x>=mu?[mu,x]:[x,mu]]});$('pgo').textContent=`z = (${nf(x)} − ${nf(mu)}) / ${nf(sd)} = ${f2((x-mu)/sd)}`};['p1','p2','p3'].forEach(i=>$(i).oninput=R(u));u()},
 area(el){let mode='mid';el.innerHTML=`<div class="gbox" id="pgg"></div><label class="field"><span>z = <b id="zv">1.00</b></span><input type="range" id="zr" min="-3.49" max="3.49" step=".01" value="1"></label><div class="seg" id="mg"><button data-m="mid">0 to z</button><button data-m="left">Left of z</button><button data-m="right">Right of z</button></div><div class="big" id="pgo"></div>`;
  const u=()=>{const z=+$('zr').value,a=A(z);$('zv').textContent=f2(z);let reg,t;if(mode==='mid'){reg=z>=0?[0,z]:[z,0];t=`Table: A(${f2(Math.abs(z))}) = ${f4(a)}`}else if(mode==='left'){reg=[null,z];t=z>=0?`Big side: 0.5 + ${f4(a)} = ${f4(.5+a)}`:`Tail: 0.5 − ${f4(a)} = ${f4(.5-a)}`}else{reg=[z,null];t=z>=0?`Tail: 0.5 − ${f4(a)} = ${f4(.5-a)}`:`Big side: 0.5 + ${f4(a)} = ${f4(.5+a)}`}
   $('pgg').innerHTML=graph({regions:[reg],markers:[{x:z,label:f2(z)}],showZ:false});$('pgo').textContent=t;$('mg').querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.m===mode))};$('zr').oninput=R(u);$('mg').querySelectorAll('button').forEach(b=>b.onclick=()=>{mode=b.dataset.m;u()});u()},
 clt(el){el.innerHTML=`<p class="mute small">The faint curve is single values (σ). The solid curve is sample means (σ/√n). Slide n and watch it narrow.</p><div class="gbox" id="pgg"></div><div class="fields">${numIn('c1','μ',120)}${numIn('c2','σ',20)}<label class="field"><span>n = <b id="nv">35</b></span><input type="range" id="c3" min="1" max="100" value="35"></label></div><div class="big" id="pgo"></div>`;
  const u=()=>{const mu=rd('c1',120),sd=Math.max(.01,rd('c2',20)),n=+$('c3').value,se=sd/Math.sqrt(n);$('nv').textContent=n;$('pgg').innerHTML=graph({mu,sd:se,ghost:{sd},showZ:false});$('pgo').textContent=`σx̄ = ${nf(sd)} / √${n} = ${nf(se,4)}`};['c1','c2'].forEach(i=>$(i).oninput=R(u));$('c3').oninput=R(u);u()},
 binom(el){el.innerHTML=`<div class="gbox" id="pgg"></div><div class="fields"><label class="field"><span>n = <b id="nv">60</b></span><input type="range" id="n1" min="5" max="150" value="60"></label><label class="field"><span>p = <b id="pv">0.30</b></span><input type="range" id="n2" min=".01" max=".99" step=".01" value=".3"></label></div><div class="big" id="pgo"></div>`;
  const u=()=>{const n=+$('n1').value,p=+$('n2').value,q=1-p,mu=n*p,sd=Math.sqrt(n*p*q);$('nv').textContent=n;$('pv').textContent=p.toFixed(2);$('pgg').innerHTML=graph({mu,sd,bars:{},showZ:false});const ok=mu>=5&&n*q>=5;
   $('pgo').innerHTML=`np = ${nf(mu)}, nq = ${nf(n*q)} → ${ok?'normal approximation OK':'<span class="badtxt">not allowed (one is below 5)</span>'}<br>μ = ${nf(mu)}, σ = ${f2(sd)}`};$('n1').oninput=R(u);$('n2').oninput=R(u);u()},
 ci(el){el.innerHTML=`<div class="gbox" id="pgg"></div><div class="fields">${numIn('i1','x̄',500)}${numIn('i2','σ',80)}${numIn('i3','n',40)}</div><div class="seg" id="cg"><button data-c="90">90%</button><button data-c="95">95%</button><button data-c="99">99%</button></div><div class="big" id="pgo"></div>`;let cl=95;
  const u=()=>{const xb=rd('i1',500),sd=Math.max(.01,rd('i2',80)),n=Math.max(1,Math.round(rd('i3',40))),s=zCI(xb,sd,n,cl,true);$('pgg').innerHTML=graph({mu:xb,sd:s.se,regions:[[s.lo,s.hi]],ci:[s.lo,s.hi],markers:[{x:xb,label:'x̄'}],showZ:false});$('pgo').textContent=`E = ${ZC[cl]} × ${nf(sd)}/√${n} = ${nf(s.E,4)} → ${f2(s.lo)} < μ < ${f2(s.hi)}`;$('cg').querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.c===cl))};
  ['i1','i2','i3'].forEach(i=>$(i).oninput=R(u));$('cg').querySelectorAll('button').forEach(b=>b.onclick=()=>{cl=+b.dataset.c;u()});u()}};

// ---------- tables dialog ----------
function openTable(kind){const d=$('tbl');$('tbltitle').textContent=kind==='z'?'Z-table: area from 0 to z':'t-table: two-tailed confidence levels';$('tblbody').innerHTML=kind==='z'?'<p class="mute small">Row = z to one decimal. Column = second decimal. Example: z = 1.85 → row 1.8, column .05 → .4678</p>'+zTableHTML():'<p class="mute small">Row = degrees of freedom (n − 1). Column = confidence level.</p>'+tTableHTML();
  if(d.showModal)d.showModal();else d.setAttribute('open','')}
const closeTbl=()=>$('tbl').close?$('tbl').close():$('tbl').removeAttribute('open');
$('btnz').onclick=()=>{closeMenu();openTable('z')};$('btnt').onclick=()=>{closeMenu();openTable('t')};$('tblclose').onclick=closeTbl;
$('tbl').addEventListener('click',e=>{if(e.target===$('tbl'))closeTbl()});
// menu (phones)
function closeMenu(){$('top').classList.remove('open');$('menubtn').setAttribute('aria-expanded','false')}
$('menubtn').onclick=e=>{e.stopPropagation();const o=$('top').classList.toggle('open');$('menubtn').setAttribute('aria-expanded',o)};
document.addEventListener('click',e=>{if($('top').classList.contains('open')&&!$('tools').contains(e.target))closeMenu()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeMenu()});
// theme: auto keeps whatever the host/system says
const HOST_THEME=document.documentElement.getAttribute('data-theme');
function applyTheme(t){const r=document.documentElement;if(t==='auto'){HOST_THEME?r.setAttribute('data-theme',HOST_THEME):r.removeAttribute('data-theme')}else r.setAttribute('data-theme',t);
  document.querySelectorAll('#theme button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.th===t));
  const dark=t==='dark'||(t==='auto'&&(HOST_THEME==='dark'||(!HOST_THEME&&matchMedia('(prefers-color-scheme: dark)').matches)));const m=document.querySelector('meta[name=theme-color]');if(m)m.content=dark?'#131e27':'#ffffff'}
document.querySelectorAll('#theme button').forEach(b=>b.onclick=()=>{store.set('theme',b.dataset.th);applyTheme(b.dataset.th)});
applyTheme(store.get('theme','auto'));
// ± button for phone keypads without a minus key
document.addEventListener('click',e=>{const b=e.target.closest('.pm');if(!b)return;e.preventDefault();const el=$(b.dataset.for);if(!el||el.disabled)return;const v=el.value.trim();el.value=v.startsWith('-')||v.startsWith('−')?v.slice(1):'-'+v;el.dispatchEvent(new Event('input',{bubbles:true}))});
// ---------- save / load progress file ----------
function progressData(){return{app:'Z-Lab',version:1,savedAt:new Date().toISOString(),done,sets:S.sets,mode:S.mode,view:S.view,topic:S.topic,cover:COVER,pads:Object.fromEntries(Object.entries(pads).filter(([k,v])=>v.transcript).map(([k,v])=>[k,{transcript:v.transcript}]))}}
function toast(msg){let t=$('toast');if(!t){t=document.createElement('div');t.id='toast';document.body.appendChild(t)}t.textContent=msg;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),3500)}
$('btnsave').onclick=async()=>{closeMenu();const json=JSON.stringify(progressData(),null,1),name=`zlab-progress-${new Date().toISOString().slice(0,10)}.json`;
  try{const d=window.claude?.use?await window.claude.use('downloads'):null;if(d){await d.save({filename:name,data:json});toast('Progress saved.');return}}catch(e){}
  try{const url=URL.createObjectURL(new Blob([json],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);toast('Progress saved as '+name)}catch(e){toast('Could not save the file on this device.')}};
$('btnload').onclick=()=>{closeMenu();$('loadfile').click()};
$('loadfile').onchange=e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{try{const d=JSON.parse(rd.result);if(d.app!=='Z-Lab'||typeof d.done!=='object')throw 0;
  done=d.done||{};S.sets=d.sets||{};S.mode=d.mode||'practice';S.view=d.view||'home';S.topic=+d.topic||0;COVER=!!d.cover;Object.keys(cache).forEach(k=>delete cache[k]);
  Object.entries(d.pads||{}).forEach(([k,v])=>pads[k]={strokes:[],transcript:v.transcript||'',open:false});
  store.set('done',done);store.set('cover',COVER);render();scrollTo(0,0);toast(`Progress loaded: ${Object.keys(done).length} questions done.`)}catch(err){toast('That file is not a Z-Lab progress file.')}e.target.value=''};rd.readAsText(f)};

render();
